name: Host Extension Gateway candidate check
on:
  pull_request:
  push:
    branches:
      - "host/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-host-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: sillytavern
      - name: Install only the Extension Gateway artifacts
        run: |
          mkdir -p sillytavern/plugins/logic-engine-extension-gateway
          cp host-adapter/extension-gateway/server-plugin/*.mjs sillytavern/plugins/logic-engine-extension-gateway/
          mkdir -p sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway
          cp host-adapter/extension-gateway/index.js host-adapter/extension-gateway/gateway-policy.mjs host-adapter/extension-gateway/host-context.mjs host-adapter/extension-gateway/conversation-identity.mjs host-adapter/extension-gateway/manifest.json sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/
          git -C sillytavern diff --exit-code
          test ! -e sillytavern/src/endpoints/logic-engine-lifecycle.js
          test ! -e sillytavern/src/endpoints/logic-engine-host-inventory.js
      - name: Verify native plugin authentication order and extension interceptor
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('sillytavern/src/server-main.js','utf8'); const p=fs.readFileSync('sillytavern/src/plugin-loader.js','utf8'); if (!(s.indexOf('app.use(requireLoginMiddleware)') < s.indexOf('loadPlugins(app, pluginsDirectory)'))) process.exit(1); if (!p.includes('app.use(`/api/plugins/${id}`, router)')) process.exit(1); const e=fs.readFileSync('sillytavern/public/scripts/extensions.js','utf8'); if (!e.includes('runGenerationInterceptors')) process.exit(1);"
      - name: Syntax-check installed Gateway
        run: |
          find sillytavern/plugins/logic-engine-extension-gateway -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/index.js
          node --check sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/host-context.mjs
      - name: Run Gateway and Host identity tests
        run: node --test host-adapter/extension-gateway/tests/*.test.mjs host-adapter/prototype/tests/st-host-inventory-handler.test.mjs host-adapter/prototype/tests/st-server-digest-proxy.test.mjs
