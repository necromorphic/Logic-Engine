name: Host lifecycle patch check

on:
  pull_request:
  push:
    branches:
      - "host/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-lifecycle-patch-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-gateway-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Logic-Engine candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Checkout exact SillyTavern source for plugin-loader contract audit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: sillytavern-host-checkout
      - name: Install Host Adapter as a native server plugin
        run: |
          mkdir -p sillytavern-host-checkout/plugins
          cp -R host-adapter sillytavern-host-checkout/plugins/logic-engine-extension-gateway
          test -f sillytavern-host-checkout/plugins/logic-engine-extension-gateway/package.json
          test -f sillytavern-host-checkout/plugins/logic-engine-extension-gateway/server-plugin/index.mjs
      - name: Verify pinned SillyTavern plugin boundary
        run: |
          grep -F "app.use(requireLoginMiddleware);" sillytavern-host-checkout/src/server-main.js
          grep -F "loadPlugins(app, pluginsDirectory)" sillytavern-host-checkout/src/server-main.js
          grep -F 'app.use(`/api/plugins/${id}`, router)' sillytavern-host-checkout/src/plugin-loader.js
          grep -F "const router = express.Router();" sillytavern-host-checkout/src/plugin-loader.js
          if grep -E "api/logic-engine|logicEngineHostInventoryRouter|logic-engine-lifecycle-proxy" host-adapter/server-plugin/index.mjs host-adapter/server-plugin/context-route.mjs; then
            echo "Host server plugin must not depend on patched ST API routes or direct Core proxy routes" >&2
            exit 1
          fi
      - name: Syntax-check Host Gateway modules
        run: |
          node --check host-adapter/server-plugin/index.mjs
          node --check host-adapter/server-plugin/context-route.mjs
          node --check host-adapter/extension-gateway/index.js
          node --check host-adapter/extension-gateway/host-client.mjs
          node --check host-adapter/extension-gateway/gateway-policy.mjs
          node --check host-adapter/prototype/st-host-inventory-handler.mjs
          node --check host-adapter/prototype/st-host-identity-store.mjs
          node --check host-adapter/prototype/host-data-inventory.mjs
          node --check host-adapter/prototype/st-server-digest-proxy.mjs
      - name: Run Host prototype, server-plugin and inventory tests
        run: |
          node --test host-adapter/server-plugin/tests/*.test.mjs
          node --test host-adapter/extension-gateway/tests/*.test.mjs
          node --test host-adapter/prototype/tests/*.test.mjs tests/host-source-inventory.test.js
      - name: Apply pinned lifecycle hooks through the Extension Gateway only
        run: |
          patch="$GITHUB_WORKSPACE/host-adapter/prototype/patches/sillytavern-1.19.0-lifecycle-hooks.patch"
          git -C sillytavern-host-checkout apply --unidiff-zero --check "$patch"
          git -C sillytavern-host-checkout apply --unidiff-zero "$patch"
          git -C sillytavern-host-checkout diff --check
          expected=$(printf '%s\n' \
            public/script.js \
            public/scripts/bookmarks.js \
            public/scripts/group-chats.js \
            public/scripts/chat-backups.js \
            public/scripts/slash-commands.js \
            src/server-main.js \
            src/endpoints/backends/chat-completions.js \
            src/endpoints/chats.js \
            src/endpoints/groups.js \
            src/endpoints/characters.js \
            src/endpoints/backups.js \
            src/endpoints/logic-engine-host-inventory-handler.mjs | sort)
          actual=$(git -C sillytavern-host-checkout diff --name-only | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          for file in \
            public/script.js \
            src/server-main.js \
            src/endpoints/backends/chat-completions.js \
            src/endpoints/chats.js \
            src/endpoints/groups.js \
            src/endpoints/characters.js \
            src/endpoints/backups.js \
            src/endpoints/logic-engine-host-inventory-handler.mjs; do
            node --check "sillytavern-host-checkout/$file"
          done
          test ! -e sillytavern-host-checkout/src/endpoints/logic-engine-lifecycle.js
          ! grep -R -n -E '/api/logic-engine|logic-engine-lifecycle.js' \
            sillytavern-host-checkout/public/script.js \
            sillytavern-host-checkout/src/endpoints
          ! grep -R -n -E '/api/logic-engine|logic-engine-lifecycle.js' \
            host-adapter/server-plugin host-adapter/extension-gateway
          cd sillytavern-host-checkout
          git status --short
