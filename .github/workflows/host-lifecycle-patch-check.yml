name: Host lifecycle patch check

on:
  # This check validates the complete assembled Host candidate, including
  # cross-layer Core/Host wiring. Path filters previously allowed a Core-only
  # commit to inherit stale Host evidence from an older SHA.
  pull_request:
  push:
    branches:
      - "work/priority1-combined-host-patch-stack-*"
      - "host/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-lifecycle-patch-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-st-host-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Logic-Engine branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout exact approved SillyTavern revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: sillytavern-host-checkout
      - name: Install prototype modules into the pinned host tree
        run: |
          mkdir -p sillytavern-host-checkout/public/scripts/logic-engine-lifecycle
          cp host-adapter/prototype/lifecycle-journal.mjs sillytavern-host-checkout/public/scripts/logic-engine-lifecycle/lifecycle-journal.mjs
          cp host-adapter/prototype/st-lifecycle-bridge.mjs sillytavern-host-checkout/public/scripts/logic-engine-lifecycle/st-lifecycle-bridge.mjs
          cp host-adapter/prototype/conversation-identity.mjs sillytavern-host-checkout/public/scripts/logic-engine-lifecycle/conversation-identity.mjs
          cp host-adapter/prototype/st-server-digest-proxy.mjs sillytavern-host-checkout/src/endpoints/logic-engine-lifecycle-proxy.mjs
      - name: Require authenticated session identity route in the reviewed Host candidate
        run: grep -F "router.get('/session', createHostSessionHandler())" host-adapter/prototype/st-host-inventory-route.js
      - name: Install reviewed Host inventory modules into the pinned host tree
        run: |
          mkdir -p sillytavern-host-checkout/src/endpoints
          cp host-adapter/prototype/st-source-inventory.mjs sillytavern-host-checkout/src/endpoints/st-source-inventory.mjs
          cp host-adapter/prototype/fs-inventory.js sillytavern-host-checkout/src/endpoints/fs-inventory.js
          cp host-adapter/prototype/windows-vss-snapshot.mjs sillytavern-host-checkout/src/endpoints/windows-vss-snapshot.mjs
          cp host-adapter/prototype/host-data-inventory.mjs sillytavern-host-checkout/src/endpoints/host-data-inventory.mjs
          cp host-adapter/prototype/st-host-inventory-handler.mjs sillytavern-host-checkout/src/endpoints/logic-engine-host-inventory-handler.mjs
          cp host-adapter/prototype/st-host-identity-store.mjs sillytavern-host-checkout/src/endpoints/logic-engine-host-identity-store.mjs
          cp host-adapter/prototype/st-host-inventory-route.js sillytavern-host-checkout/src/endpoints/logic-engine-host-inventory.js
      - name: Apply-check and apply lifecycle, inventory, then delete-safety patches
        run: |
          cd sillytavern-host-checkout
          git apply --check "$GITHUB_WORKSPACE/host-adapter/prototype/patches/sillytavern-1.19.0-lifecycle-hooks.patch"
          git apply "$GITHUB_WORKSPACE/host-adapter/prototype/patches/sillytavern-1.19.0-lifecycle-hooks.patch"
          git apply --check "$GITHUB_WORKSPACE/host-adapter/prototype/patches/sillytavern-1.19.0-source-inventory-route.patch"
          git apply "$GITHUB_WORKSPACE/host-adapter/prototype/patches/sillytavern-1.19.0-source-inventory-route.patch"
          git apply --check "$GITHUB_WORKSPACE/host-adapter/prototype/patches/issue-258-direction-a-delete-safety.patch"
          git apply "$GITHUB_WORKSPACE/host-adapter/prototype/patches/issue-258-direction-a-delete-safety.patch"
          git diff --check
      - name: Syntax-check patched host and prototype modules
        run: |
          node --check sillytavern-host-checkout/public/script.js
          node --check sillytavern-host-checkout/public/scripts/slash-commands.js
          node --check sillytavern-host-checkout/public/scripts/logic-engine-lifecycle/lifecycle-journal.mjs
          node --check sillytavern-host-checkout/public/scripts/logic-engine-lifecycle/st-lifecycle-bridge.mjs
          node --check sillytavern-host-checkout/public/scripts/logic-engine-lifecycle/conversation-identity.mjs
          node --check sillytavern-host-checkout/src/endpoints/logic-engine-lifecycle-proxy.mjs
          node --check sillytavern-host-checkout/src/endpoints/logic-engine-lifecycle.js
          node --check sillytavern-host-checkout/src/endpoints/st-source-inventory.mjs
          node --check sillytavern-host-checkout/src/endpoints/fs-inventory.js
          node --check sillytavern-host-checkout/src/endpoints/windows-vss-snapshot.mjs
          node --check sillytavern-host-checkout/src/endpoints/host-data-inventory.mjs
          node --check sillytavern-host-checkout/src/endpoints/logic-engine-host-inventory-handler.mjs
          node --check sillytavern-host-checkout/src/endpoints/logic-engine-host-inventory.js
          node --check sillytavern-host-checkout/src/endpoints/logic-engine-host-identity-store.mjs
          node --check sillytavern-host-checkout/src/server-startup.js
          node --check sillytavern-host-checkout/src/server-main.js
          node --check sillytavern-host-checkout/src/endpoints/backends/chat-completions.js
      - name: Ensure MakerSuite request body is not logged
        run: |
          if grep -F 'console.debug(`${apiName} request:`, body)' sillytavern-host-checkout/src/endpoints/backends/chat-completions.js; then
            echo "Raw MakerSuite/Vertex request body logging must not be present" >&2
            exit 1
          fi
          grep -F 'request metadata:' sillytavern-host-checkout/src/endpoints/backends/chat-completions.js >/dev/null
      - name: Run all Host prototype and inventory tests
        run: node --test host-adapter/prototype/tests/*.test.mjs tests/host-source-inventory.test.js
