name: Host Extension Gateway validation

on:
  pull_request:
  push:
    branches:
      - "host/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-extension-gateway-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Logic-Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Checkout exact SillyTavern source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: sillytavern-host-checkout
      - name: Stage Gateway as a supported SillyTavern server plugin
        run: |
          mkdir -p sillytavern-host-checkout/plugins/logic-engine-extension-gateway
          cp -R host-adapter/prototype/server-plugin/. sillytavern-host-checkout/plugins/logic-engine-extension-gateway/
          test -f sillytavern-host-checkout/plugins/logic-engine-extension-gateway/package.json
          node --check sillytavern-host-checkout/plugins/logic-engine-extension-gateway/index.mjs
      - name: Verify plugin loader authentication boundary
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const main=fs.readFileSync('sillytavern-host-checkout/src/server-main.js','utf8'); const loader=fs.readFileSync('sillytavern-host-checkout/src/plugin-loader.js','utf8'); if(main.indexOf('app.use(requireLoginMiddleware)')<0 || main.indexOf('loadPlugins(app, pluginsDirectory)')<main.indexOf('app.use(requireLoginMiddleware)') || !loader.includes('app.use(`/api/plugins/${id}`, router)')) process.exit(1);"
      - name: Run Host Gateway and identity regression tests
        run: node --test host-adapter/prototype/tests/*.test.mjs
      - name: Check whitespace and patch independence
        run: |
          git diff --check
          if grep -R -n -E 'git apply .*sillytavern|/api/logic-engine/host' .github/workflows/host-adapter-pinned-source-audit.yml .github/workflows/host-lifecycle-patch-check.yml; then
            echo "Active Host transport CI must not apply SillyTavern source patches or mount legacy routes" >&2
            exit 1
          fi
