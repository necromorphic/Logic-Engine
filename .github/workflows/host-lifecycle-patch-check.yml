name: Host Extension Gateway candidate check
on:
  pull_request:
  push:
    branches:
      - "host/**"
      - "integration/host-core-v1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-host-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: sillytavern
      - name: Install Gateway artifacts and apply the pinned lifecycle patch
        shell: bash
        run: |
          mkdir -p sillytavern/plugins/logic-engine-extension-gateway
          cp host-adapter/extension-gateway/server-plugin/*.mjs host-adapter/extension-gateway/server-plugin/*.js host-adapter/extension-gateway/server-plugin/package.json sillytavern/plugins/logic-engine-extension-gateway/
          mkdir -p sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway
          cp host-adapter/extension-gateway/index.js host-adapter/extension-gateway/gateway-policy.mjs host-adapter/extension-gateway/host-context.mjs host-adapter/extension-gateway/conversation-identity.mjs host-adapter/extension-gateway/manifest.json sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/
          # Re-checkout pinned blobs with LF before applying LF-authored patches.
          git -C sillytavern config core.autocrlf false
          git -C sillytavern reset --hard HEAD
          patch="$PWD/host-adapter/prototype/patches/sillytavern-1.19.0-lifecycle-hooks.patch"
          git -C sillytavern -c core.autocrlf=false apply --unidiff-zero --check "$patch"
          git -C sillytavern -c core.autocrlf=false apply --unidiff-zero "$patch"
          root_mutation_patch="$PWD/host-adapter/prototype/patches/sillytavern-1.19.0-root-mutation-guards.patch"
          git -C sillytavern -c core.autocrlf=false apply --unidiff-zero --check "$root_mutation_patch"
          git -C sillytavern -c core.autocrlf=false apply --unidiff-zero "$root_mutation_patch"
          git -C sillytavern diff --check
          expected=$(printf '%s\n' 'public/script.js' 'public/scripts/bookmarks.js' 'public/scripts/chat-backups.js' 'public/scripts/group-chats.js' 'public/scripts/logic-engine-lifecycle/conversation-identity.mjs' 'public/scripts/logic-engine-lifecycle/lifecycle-journal.mjs' 'public/scripts/logic-engine-lifecycle/st-lifecycle-bridge.mjs' 'public/scripts/slash-commands.js' 'src/endpoints/assets.js' 'src/endpoints/avatars.js' 'src/endpoints/backends/chat-completions.js' 'src/endpoints/backgrounds.js' 'src/endpoints/backups.js' 'src/endpoints/characters.js' 'src/endpoints/chats.js' 'src/endpoints/content-manager.js' 'src/endpoints/data-maid.js' 'src/endpoints/extensions.js' 'src/endpoints/files.js' 'src/endpoints/groups.js' 'src/endpoints/image-metadata.js' 'src/endpoints/images.js' 'src/endpoints/logic-engine-host-inventory-handler.mjs' 'src/endpoints/moving-ui.js' 'src/endpoints/presets.js' 'src/endpoints/quick-replies.js' 'src/endpoints/secrets.js' 'src/endpoints/settings.js' 'src/endpoints/sprites.js' 'src/endpoints/stable-diffusion.js' 'src/endpoints/stats.js' 'src/endpoints/themes.js' 'src/endpoints/thumbnails.js' 'src/endpoints/users-admin.js' 'src/endpoints/users-private.js' 'src/endpoints/users-public.js' 'src/endpoints/vectors.js' 'src/endpoints/worldinfo.js' 'src/plugin-loader.js' 'src/server-main.js' 'src/users.js')
          actual=$({ git -C sillytavern diff --name-only; git -C sillytavern ls-files --others --exclude-standard; } | sort)
          diff -u <(printf '%s\n' "$expected" | sort) <(printf '%s\n' "$actual")
          test ! -e sillytavern/src/endpoints/logic-engine-lifecycle.js
          test ! -e sillytavern/src/endpoints/logic-engine-host-inventory.js
          ! grep -R -n --include='*.mjs' --include='*.js' '/api/logic-engine' host-adapter/extension-gateway
          ! grep -n '/api/logic-engine' host-adapter/prototype/patches/sillytavern-1.19.0-lifecycle-hooks.patch
      - name: Verify native plugin authentication order and extension interceptor
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('sillytavern/src/server-main.js','utf8'); const p=fs.readFileSync('sillytavern/src/plugin-loader.js','utf8'); if (!(s.indexOf('app.use(requireLoginMiddleware)') < s.indexOf('loadPlugins(app, pluginsDirectory)'))) process.exit(1); if (!(p.includes('/api/plugins/') && p.includes('router'))) process.exit(1); const e=fs.readFileSync('sillytavern/public/scripts/extensions.js','utf8'); if (!e.includes('runGenerationInterceptors')) process.exit(1);"
      - name: Syntax-check patched Host and Gateway
        run: |
          find sillytavern/plugins/logic-engine-extension-gateway -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check sillytavern/plugins/logic-engine-extension-gateway/fs-inventory.js
          node --check sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/index.js
          node --check sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/host-context.mjs
          node --check sillytavern/public/scripts/logic-engine-lifecycle/conversation-identity.mjs
          node --check sillytavern/public/scripts/logic-engine-lifecycle/lifecycle-journal.mjs
          node --check sillytavern/public/scripts/logic-engine-lifecycle/st-lifecycle-bridge.mjs
          for f in public/script.js public/scripts/bookmarks.js public/scripts/chat-backups.js public/scripts/group-chats.js public/scripts/logic-engine-lifecycle/conversation-identity.mjs public/scripts/logic-engine-lifecycle/lifecycle-journal.mjs public/scripts/logic-engine-lifecycle/st-lifecycle-bridge.mjs public/scripts/slash-commands.js src/endpoints/assets.js src/endpoints/avatars.js src/endpoints/backends/chat-completions.js src/endpoints/backgrounds.js src/endpoints/backups.js src/endpoints/characters.js src/endpoints/chats.js src/endpoints/content-manager.js src/endpoints/data-maid.js src/endpoints/extensions.js src/endpoints/files.js src/endpoints/groups.js src/endpoints/image-metadata.js src/endpoints/images.js src/endpoints/logic-engine-host-inventory-handler.mjs src/endpoints/moving-ui.js src/endpoints/presets.js src/endpoints/quick-replies.js src/endpoints/secrets.js src/endpoints/settings.js src/endpoints/sprites.js src/endpoints/stable-diffusion.js src/endpoints/stats.js src/endpoints/themes.js src/endpoints/thumbnails.js src/endpoints/users-admin.js src/endpoints/users-private.js src/endpoints/users-public.js src/endpoints/vectors.js src/endpoints/worldinfo.js src/plugin-loader.js src/server-main.js src/users.js; do node --check "sillytavern/$f"; done
      - name: Run Gateway, lifecycle and identity tests
        env:
          SILLYTAVERN_SOURCE_ROOT: sillytavern
        run: |
          node --test host-adapter/extension-gateway/tests/*.test.mjs host-adapter/prototype/tests/lifecycle-acceptance-scenarios.test.mjs host-adapter/prototype/tests/pinned-st-source-audit.test.mjs host-adapter/prototype/tests/st-host-inventory-handler.test.mjs host-adapter/prototype/tests/st-server-digest-proxy.test.mjs src/application/host-session-context.test.js
