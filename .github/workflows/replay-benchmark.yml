name: Replay growth benchmark
on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/replay-rollback-growth.mjs'
      - 'src/application/engine.js'
      - 'src/storage/sqlite-store.js'
      - 'package.json'
      - '.github/workflows/replay-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify installed Node.js
        shell: powershell
        run: |
          node --version
          $version = [version](node -p "process.versions.node")
          if ($version -lt [version]"22.13.0") {
            throw "Node.js 22.13.0 or newer is required; found $version"
          }
      - name: Measure commit, rollback, and projection rebuild
        run: npm run benchmark:replay
