name: Replay growth benchmark
on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/replay-rollback-growth.mjs'
      - 'src/application/engine.js'
      - 'src/storage/sqlite-store.js'
      - 'package.json'
      - '.github/workflows/replay-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify installed Node.js
        run: |
          node --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"
      - name: Measure commit, rollback, and projection rebuild
        run: npm run benchmark:replay
