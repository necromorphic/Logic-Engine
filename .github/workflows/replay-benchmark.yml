name: Replay growth benchmark
on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/replay-rollback-growth.mjs'
      - 'src/application/engine.js'
      - 'src/storage/sqlite-store.js'
      - 'package.json'
      - '.github/workflows/replay-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Measure commit, rollback, and projection rebuild
        run: npm run benchmark:replay
