name: SQLite VFS extension bootstrap probe

# Run on pushes and pull requests. The checkout is pinned to the PR head SHA so
# the Windows/Linux results validate the exact reviewed source commit, not a merge ref.
on:
  push:
    branches:
      - 'security/**'
    paths:
      - 'native/secure-vfs-probe/*.c'
      - 'native/windows-namespace-broker/**'
      - 'tests/windows-broker-service-host.test.js'
      - 'native/secure-vfs-probe/*.h'
      - 'native/secure-vfs-probe/*.js'
      - 'tests/windows-manifest-lifecycle.test.js'
      - 'tests/security-vfs-extension-bootstrap.test.js'
      - 'tests/security-vfs-broker-integration.test.js'
      - 'tests/security-vfs-strict-mode.test.js'
      - 'native/posix-namespace-broker/test_vfs_fake_server.py'
      - 'docs/97-issue-770-windows-vfs-integration-contract.md'
      - 'docs/security/sqlite-vfs-directory-anchor-design.md'
      - 'docs/security/sqlite-database-role-inventory.md'
      - 'native/secure-vfs-probe/README.md'
      - 'deploy/sqlite-security/**'
      - 'tests/sqlite-windows-acl-installer.test.js'
      - 'schemas/sqlite-role-manifest.schema.json'
      - 'tests/sqlite-role-manifest-schema.test.js'
      - '.github/workflows/security-vfs-extension-bootstrap.yml'
  pull_request:
    paths:
      - 'native/secure-vfs-probe/*.c'
      - 'native/windows-namespace-broker/**'
      - 'tests/windows-broker-service-host.test.js'
      - 'native/secure-vfs-probe/*.js'
      - 'tests/windows-manifest-lifecycle.test.js'
      - 'tests/sqlite-windows-acl-installer.test.js'
      - 'native/secure-vfs-probe/*.h'
      - 'tests/security-vfs-extension-bootstrap.test.js'
      - 'docs/97-issue-770-windows-vfs-integration-contract.md'
      - 'docs/security/sqlite-vfs-directory-anchor-design.md'
      - 'docs/security/sqlite-database-role-inventory.md'
      - 'native/secure-vfs-probe/README.md'
      - 'deploy/sqlite-security/**'
      - 'schemas/sqlite-role-manifest.schema.json'
      - 'tests/sqlite-role-manifest-schema.test.js'
      - '.github/workflows/security-vfs-extension-bootstrap.yml'

permissions:
      - '.github/workflows/provider-blocker3.yml'
  contents: read

# Keep active exact-head VFS bootstrap probes running across newer integration commits.
concurrency:
  group: sqlite-vfs-probe-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Provide Node path for systemd unit validation
        run: |
          if [ ! -x /usr/bin/node ]; then sudo ln -s "$(command -v node)" /usr/bin/node; fi
      - name: Validate systemd service unit
        run: systemd-analyze verify deploy/sqlite-security/logic-engine.service deploy/sqlite-security/logic-engine-sqlite-broker.service
      - name: Build VFS registration probe
        run: cc -O2 -fPIC -shared -DLOGIC_ENGINE_VFS_PROBE_ALLOW_UNBROKERED_TEST_ROLES -I native/secure-vfs-probe native/secure-vfs-probe/secure_vfs_probe.c -o native/secure-vfs-probe/secure_vfs_probe.so
      - name: Verify persistent VFS registration through node:sqlite
        env:
          LOGIC_ENGINE_VFS_PROBE_PATH: native/secure-vfs-probe/secure_vfs_probe.so
        run: node --test tests/security-vfs-extension-bootstrap.test.js tests/security-vfs-broker-integration.test.js tests/sqlite-broker-systemd-units.test.js
      - name: Build strict Linux VFS without unbrokered enrollment API
        run: cc -O2 -fPIC -shared -I native/secure-vfs-probe native/secure-vfs-probe/secure_vfs_probe.c -o native/secure-vfs-probe/secure_vfs_probe_strict.so
      - name: Verify strict Linux role enrollment is broker-only
        env:
          LOGIC_ENGINE_VFS_STRICT_PROBE_PATH: native/secure-vfs-probe/secure_vfs_probe_strict.so
        run: node --test tests/security-vfs-strict-mode.test.js

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Test recursive Windows service ACL policy
        run: node --test tests/sqlite-windows-acl-installer.test.js
      - name: Test Windows broker, metadata store and sidecar adapter contracts
        run: node --test tests/windows-broker-service-host.test.js
      - name: Build and exercise Windows durable manifest and sidecar adapters
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $command = 'call "' + $vcvars + '" && cl /nologo /W4 /WX /guard:cf /DUNICODE /D_UNICODE native\\windows-namespace-broker\\windows_manifest_store_smoke.c /link bcrypt.lib advapi32.lib /OUT:native\\windows-namespace-broker\\windows_manifest_store_smoke.exe && native\\windows-namespace-broker\\windows_manifest_store_smoke.exe'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Windows durable manifest and sidecar smoke test failed' }
      - name: Compile Windows broker service host
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $command = 'call "' + $vcvars + '" && cl /nologo /W4 /WX /guard:cf /DUNICODE /D_UNICODE native\\windows-namespace-broker\\windows_broker_service.c /link advapi32.lib /OUT:native\\windows-namespace-broker\\windows_broker_service.exe'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Windows broker service host compilation failed' }
      - name: Parse and test Windows service installer path guards
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path deploy/sqlite-security/install-windows-service.ps1),
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $functionAst = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Test-PathWithin'
          }, $true)
          if (-not $functionAst) { throw 'Test-PathWithin function is missing' }
          Invoke-Expression $functionAst.Extent.Text
          if (-not (Test-PathWithin 'C:\LogicEngine' 'C:\LogicEngine\State')) {
            throw 'Nested state path was not detected'
          }
          if (Test-PathWithin 'C:\LogicEngine' 'C:\LogicEngine2\State') {
            throw 'Sibling path was incorrectly treated as nested'
          }
          if (-not (Test-PathWithin 'C:\' 'C:\ProgramData')) {
            throw 'Drive-root containment was not detected'
          }
      - name: Verify Windows installer WhatIf has no filesystem or service side effects
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('logic-engine-installer-whatif-' + [guid]::NewGuid().ToString('N'))
          $install = Join-Path $root 'install'
          $state = Join-Path $root 'state'
          $serviceName = 'LEWhatIf' + [guid]::NewGuid().ToString('N').Substring(0, 8)
          New-Item -ItemType Directory -Path (Join-Path $install 'src') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $install 'src/index.js') -Value '/* installer WhatIf fixture */'
          try {
            $node = (Get-Command node.exe -ErrorAction Stop).Source
            $oldNode = Join-Path $root 'node-22.13.cmd'
            Set-Content -LiteralPath $oldNode -Value @('@echo off', 'echo v22.13.0', 'exit /b 0')
            $oldRuntimeRejected = $false
            try {
              & deploy/sqlite-security/install-windows-service.ps1 -ServiceName $serviceName -InstallDirectory $install -StateDirectory $state -NodePath $oldNode -WhatIf
            } catch {
              if ($_.Exception.Message -like '*Node.js 22.14.0 or newer is required*') {
                $oldRuntimeRejected = $true
              } else {
                throw
              }
            }
            if (-not $oldRuntimeRejected) {
              throw 'Installer did not reject the unsupported Node 22.13 runtime'
            }
            if (Test-Path -LiteralPath $state) {
              throw 'Unsupported Node runtime unexpectedly created the state directory'
            }
            & deploy/sqlite-security/install-windows-service.ps1 -ServiceName $serviceName -InstallDirectory $install -StateDirectory $state -NodePath $node -WhatIf
            if (Test-Path -LiteralPath $state) {
              throw 'WhatIf unexpectedly created the state directory'
            }
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              throw 'WhatIf unexpectedly created a Windows service'
            }
            New-Item -ItemType File -Path $state -Force | Out-Null
            $invalidStateRejected = $false
            try {
              & deploy/sqlite-security/install-windows-service.ps1 -ServiceName $serviceName -InstallDirectory $install -StateDirectory $state -NodePath $node -WhatIf
            } catch {
              if ($_.Exception.Message -like '*StateDirectory exists but is not a directory*') {
                $invalidStateRejected = $true
              } else {
                throw
              }
            }
            if (-not $invalidStateRejected) {
              throw 'Installer did not reject a file supplied as StateDirectory'
            }
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              throw 'Invalid StateDirectory unexpectedly created a Windows service'
            }
          } finally {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Build VFS registration probe
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $command = '"' + $vcvars + '" && cl /nologo /O2 /LD /I native\\secure-vfs-probe native\\secure-vfs-probe\\secure_vfs_probe.c /link /OUT:native\\secure-vfs-probe\\secure_vfs_probe.dll'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw 'VFS probe compilation failed' }
          $relativeCommand = 'call "' + $vcvars + '" && cl /nologo /O2 /I native\\secure-vfs-probe native\\secure-vfs-probe\\windows_relative_open_test.c /link /OUT:native\\secure-vfs-probe\\windows_relative_open_test.exe'
          cmd /c $relativeCommand
          if ($LASTEXITCODE -ne 0) { throw 'Windows relative-open test compilation failed' }
      - name: Stop MSVC background helper processes
        if: always()
        shell: pwsh
        run: |
          $helpers = Get-Process -Name vctip -ErrorAction SilentlyContinue
          if ($helpers) { $helpers | Stop-Process -Force -ErrorAction SilentlyContinue }
      - name: Verify Windows handle-relative directory anchoring
        shell: pwsh
        run: native/secure-vfs-probe/windows_relative_open_test.exe
      - name: Verify persistent VFS registration through node:sqlite
        shell: pwsh
        env:
          LOGIC_ENGINE_VFS_PROBE_PATH: native/secure-vfs-probe/secure_vfs_probe.dll
        run: node --test tests/security-vfs-extension-bootstrap.test.js

  manifest-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install schema validation dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate persistent role manifest schema
        run: node --test tests/sqlite-role-manifest-schema.test.js
      - name: Test Windows manifest lifecycle transactions and crash recovery
        run: node --test tests/windows-manifest-lifecycle.test.js
