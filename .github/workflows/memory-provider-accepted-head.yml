name: Memory Provider accepted-head acceptance

on:
  push:
    branches:
      - 'fix/provider-*'
  pull_request:
    paths:
      - 'src/application/sqlite-memory-provider.js'
      - 'src/storage/sqlite-store.js'
      - 'src/security/accepted-head-*.js'
      - 'src/security/enroll-accepted-head-domain.js'
      - 'src/security/recover-accepted-head-domain.js'
      - 'src/security/memory-dispatch-gateway*.js'
      - 'tests/accepted-head-authority.test.js'
      - 'tests/core-accepted-head-handshake.test.js'
      - 'tests/provider-accepted-head-handshake.test.js'
      - 'tests/memory-dispatch-gateway.test.js'
      - '.github/workflows/memory-provider-accepted-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-head-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run repository-native runtime suite
        run: npm test
      - name: Run recalculation oracle
        run: node --test experiments/recalculation-oracle/harness.test.mjs
      - name: Run NPC boundary
        run: node --test tests/npc-memory-candidate-eligibility.test.js tests/memory-npc-consumer.test.js
