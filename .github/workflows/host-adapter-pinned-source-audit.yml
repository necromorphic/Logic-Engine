name: Host Adapter pinned SillyTavern source audit

on:
  pull_request:
    paths:
      - ".github/workflows/host-adapter-pinned-source-audit.yml"
      - "host-adapter/prototype/**"
      - "host-adapter/patches/**"
      - "host-adapter/PATCH-MANAGER.md"
      - "host-adapter/sillytavern-final-send-adapter.mjs"
      - "host-adapter/protected-memory-final-send.mjs"
      - "host-adapter/sillytavern-generation-bridge.mjs"
      - "host-adapter/sillytavern-final-send-adapter.mjs"
      - "host-adapter/tests/**"
      - "scripts/sillytavern-patch-manager.mjs"
      - "scripts/install-logic-engine-extension.mjs"
      - "tests/sillytavern-patch-manager.test.js"
      - "tests/sillytavern-final-send-patch-artifact.test.js"
      - "experiments/host-adapter-source-audit/harness.mjs"
      - "experiments/host-adapter-runtime-harness/harness.mjs"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  pinned-source-audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Logic-Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify installed Node.js
        shell: cmd
        run: |
          node --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"

      - name: Checkout exact SillyTavern target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: SillyTavern

      - name: Ensure Git is available to Patch Manager subprocesses
        shell: cmd
        run: echo C:\Program Files\Git\cmd>>%GITHUB_PATH%

      - name: Install pinned SillyTavern dependencies
        run: npm ci --prefix SillyTavern

      - name: Record pinned checkout identity
        run: node -e "console.log('SillyTavern source is pinned by actions/checkout ref 06bde939fb1e9c4c8d8641d810f0a916b5bce127')"

      - name: Run source-level lifecycle assertions
        env:
          SILLYTAVERN_DIR: SillyTavern
        run: node --test experiments/host-adapter-source-audit/harness.mjs

      - name: Run bounded fake-provider integration harness
        env:
          SILLYTAVERN_DIR: SillyTavern
        run: node --test experiments/host-adapter-runtime-harness/harness.mjs

      - name: Print canonical patch artifact digest
        shell: cmd
        run: node -e "const fs=require('node:fs');const c=require('node:crypto');const p=fs.readFileSync('host-adapter/patches/sillytavern-1.19.0-final-send.patch','utf8').replace(/\\r\\n/g,'\\n');console.log('PATCH_SHA256='+c.createHash('sha256').update(p,'utf8').digest('hex'))"

      - name: Print pinned source baseline digests
        shell: cmd
        run: node -e "const fs=require('node:fs');const c=require('node:crypto');const m=JSON.parse(fs.readFileSync('host-adapter/patches/sillytavern-1.19.0-final-send.manifest.json','utf8'));for(const [p] of Object.entries(m.sourceFiles)){const b=fs.readFileSync('SillyTavern/'+p);const h=c.createHash('sha256').update(b.toString('utf8').replace(/\r\n/g,'\n'),'utf8').digest('hex');console.log('SOURCE_SHA256 '+p+' '+h)}"

      - name: Apply and verify managed Final-Send patch against exact SillyTavern source
        shell: cmd
        run: |
          node scripts/sillytavern-patch-manager.mjs preflight --st-root "%CD%\SillyTavern"
          if errorlevel 1 exit /b 1
          node scripts/sillytavern-patch-manager.mjs install --st-root "%CD%\SillyTavern"
          if errorlevel 1 exit /b 1
          node scripts/sillytavern-patch-manager.mjs verify --st-root "%CD%\SillyTavern"
          if errorlevel 1 exit /b 1
          node --check SillyTavern/src/endpoints/backends/chat-completions.js
          if errorlevel 1 exit /b 1
          node --check SillyTavern/src/endpoints/extensions.js
          if errorlevel 1 exit /b 1
          node --check SillyTavern/src/logic-engine-final-send-hook.js
          if errorlevel 1 exit /b 1
          node --check SillyTavern/src/logic-engine-extension-install-hook.js
          if errorlevel 1 exit /b 1
          node scripts/sillytavern-patch-manager.mjs uninstall --st-root "%CD%\SillyTavern"
          if errorlevel 1 exit /b 1
