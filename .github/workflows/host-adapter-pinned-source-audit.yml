name: Host Adapter pinned SillyTavern Extension Gateway audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "host-adapter/prototype/**"
      - "experiments/host-adapter-source-audit/harness.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-adapter-pinned-source-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-source-audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Logic-Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Checkout exact SillyTavern target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: SillyTavern
      - name: Verify exact SillyTavern revision and stage the supported server plugin
        shell: powershell
        run: |
          $expected = '06bde939fb1e9c4c8d8641d810f0a916b5bce127'
          $actual = (git -C SillyTavern rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Unexpected SillyTavern checkout SHA: $actual" }
          New-Item -ItemType Directory -Force SillyTavern/plugins/logic-engine-extension-gateway | Out-Null
          Copy-Item host-adapter/prototype/server-plugin/* SillyTavern/plugins/logic-engine-extension-gateway/ -Recurse -Force
          if (-not (Test-Path SillyTavern/plugins/logic-engine-extension-gateway/package.json)) { throw 'Gateway plugin package was not staged' }
          Write-Output "SillyTavern target SHA: $actual"
      - name: Install pinned SillyTavern dependencies
        run: npm ci --prefix SillyTavern
      - name: Audit pinned Host lifecycle source semantics and Gateway mount
        env:
          SILLYTAVERN_DIR: SillyTavern
          SILLYTAVERN_CHECKED_OUT_REF: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
        run: node --test experiments/host-adapter-source-audit/harness.mjs host-adapter/prototype/tests/server-plugin.test.mjs
      - name: Run Host prototype tests
        run: node --test host-adapter/prototype/tests/*.test.mjs
