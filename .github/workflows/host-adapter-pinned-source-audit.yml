name: Host Adapter pinned SillyTavern source audit

on:
  pull_request:
    paths:
      - ".github/workflows/host-adapter-pinned-source-audit.yml"
      - "host-adapter/prototype/**"
      - "experiments/host-adapter-source-audit/harness.mjs"
      - "experiments/host-adapter-runtime-harness/harness.mjs"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  pinned-source-audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout Logic-Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The runner service account does not inherit the interactive user's PATH.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'

      - name: Verify installed Node.js and npm
        shell: cmd
        run: |
          node --version
          npm --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"

      - name: Checkout exact SillyTavern target
        id: checkout-st
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: SillyTavern

      - name: Install pinned SillyTavern dependencies
        run: npm ci --prefix SillyTavern

      # actions/checkout falls back to a REST archive when Git is absent.
      # This self-hosted service account has no Git executable; the immutable
      # 40-character ref above is resolved by checkout (visible in its action
      # log), so do not require a local .git directory to verify the source.
      - name: Verify pinned source archive
        shell: pwsh
        env:
          CHECKED_OUT_REF: ${{ steps.checkout-st.outputs.ref }}
        run: |
          $expected = '06bde939fb1e9c4c8d8641d810f0a916b5bce127'
          if ($env:CHECKED_OUT_REF -ne $expected) {
            throw "Unexpected SillyTavern checkout ref: $env:CHECKED_OUT_REF"
          }
          if (-not (Test-Path 'SillyTavern/package.json' -PathType Leaf)) {
            throw 'Pinned SillyTavern source archive is missing package.json'
          }
          $package = Get-Content 'SillyTavern/package.json' -Raw | ConvertFrom-Json
          if (-not $package.name -or -not $package.version) {
            throw 'Pinned SillyTavern package metadata is invalid'
          }
          Write-Output "SillyTavern source was checked out using immutable commit ref $expected"
          Write-Output "Package: $($package.name)@$($package.version)"

      - name: Run source-level lifecycle assertions
        env:
          SILLYTAVERN_DIR: SillyTavern
        run: node --test experiments/host-adapter-source-audit/harness.mjs

      - name: Run bounded fake-provider integration harness
        env:
          SILLYTAVERN_DIR: SillyTavern
        run: node --test experiments/host-adapter-runtime-harness/harness.mjs
