name: Host Adapter pinned SillyTavern source audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "host-adapter/**"
      - "experiments/host-adapter-source-audit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-adapter-pinned-source-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-source-audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Logic-Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pin Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Checkout exact SillyTavern target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: SillyTavern
      - name: Verify pinned source and assemble native plugin
        shell: powershell
        run: |
          $expected = '06bde939fb1e9c4c8d8641d810f0a916b5bce127'
          $actual = (git -C SillyTavern rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Unexpected SillyTavern SHA: $actual" }
          New-Item -ItemType Directory -Force -Path 'SillyTavern/plugins' | Out-Null
          Copy-Item -Recurse -Force 'host-adapter' 'SillyTavern/plugins/logic-engine-host-adapter'
          if (-not (Test-Path 'SillyTavern/plugins/logic-engine-host-adapter/package.json')) { throw 'Server plugin package.json missing' }
          if (-not (Test-Path 'SillyTavern/plugins/logic-engine-host-adapter/server-plugin/index.mjs')) { throw 'Server plugin entry point missing' }
          Write-Output "SillyTavern target SHA: $actual"
      - name: Run pinned source and native plugin-loader audit
        env:
          SILLYTAVERN_DIR: SillyTavern
        run: node --test experiments/host-adapter-source-audit/harness.mjs
      - name: Run Extension Gateway tests
        run: |
          node --test host-adapter/server-plugin/tests/*.test.mjs
          node --test host-adapter/extension-gateway/tests/*.test.mjs
      - name: Run Host identity and inventory regression tests
        run: node --test host-adapter/prototype/tests/*.test.mjs tests/host-source-inventory.test.js
      - name: Verify no SillyTavern source modifications
        shell: powershell
        run: |
          $changes = git -C SillyTavern status --short
          $sourceChanges = $changes | Where-Object { $_ -notmatch '^\?\? plugins/' }
          if ($sourceChanges) { $sourceChanges; throw 'SillyTavern source tree was modified' }
