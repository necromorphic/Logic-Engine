name: Host Adapter pinned SillyTavern source audit

on:
  pull_request:
    paths:
      - ".github/workflows/host-adapter-pinned-source-audit.yml"
      - "host-adapter/prototype/**"
      - "experiments/host-adapter-source-audit/harness.mjs"
      - "experiments/host-adapter-runtime-harness/harness.mjs"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  pinned-source-audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Logic-Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Verify installed Node.js
        shell: cmd
        run: |
          node --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"

      - name: Checkout exact SillyTavern target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: SillyTavern

      - name: Install pinned SillyTavern dependencies
        run: npm ci --prefix SillyTavern

      - name: Verify pinned checkout
        shell: cmd
        run: |
          for /f %%H in ('git -C SillyTavern rev-parse HEAD') do set "actual=%%H"
          if /I not "%actual%"=="06bde939fb1e9c4c8d8641d810f0a916b5bce127" (
            echo Unexpected SillyTavern SHA: %actual%
            exit /b 1
          )
          echo SillyTavern target SHA: %actual%

      - name: Stage lifecycle helpers and apply the reviewed Host patch
        shell: cmd
        run: |
          mkdir SillyTavern\public\scripts\logic-engine-lifecycle
          copy host-adapter\prototype\lifecycle-journal.mjs SillyTavern\public\scripts\logic-engine-lifecycle\lifecycle-journal.mjs
          copy host-adapter\prototype\st-lifecycle-bridge.mjs SillyTavern\public\scripts\logic-engine-lifecycle\st-lifecycle-bridge.mjs
          copy host-adapter\prototype\conversation-identity.mjs SillyTavern\public\scripts\logic-engine-lifecycle\conversation-identity.mjs
          copy host-adapter\prototype\st-server-digest-proxy.mjs SillyTavern\src\endpoints\logic-engine-lifecycle-proxy.mjs
          git -C SillyTavern apply --unidiff-zero --check ..\host-adapter\prototype\patches\sillytavern-1.19.0-lifecycle-hooks.patch
          git -C SillyTavern apply --unidiff-zero ..\host-adapter\prototype\patches\sillytavern-1.19.0-lifecycle-hooks.patch

      - name: Run source-level lifecycle assertions
        env:
          SILLYTAVERN_DIR: SillyTavern
        run: node --test experiments/host-adapter-source-audit/harness.mjs

      - name: Run bounded fake-provider integration harness
        env:
          SILLYTAVERN_DIR: SillyTavern
        run: node --test experiments/host-adapter-runtime-harness/harness.mjs
