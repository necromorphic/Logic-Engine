name: Host Extension Gateway pinned SillyTavern source audit
on:
  pull_request:
  push:
    branches:
      - "host/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pinned-source:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: Sillytavern
      - name: Normalize pinned SillyTavern checkout line endings
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git -C Sillytavern config core.autocrlf false
          git -C Sillytavern config core.eol lf
          git -C Sillytavern reset --hard 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SillyTavern checkout could not be normalized to LF' }
          git -C Sillytavern checkout-index --force --all
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SillyTavern tracked files could not be rewritten with LF' }
      - name: Syntax-check transactional Host patch-bundle installer
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node --check scripts/install-sillytavern-host-patch-bundle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise transactional Host bundle installer against a clean pinned source copy
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'SillyTavern-host-bundle-install-test'
          New-Item -ItemType Directory -Force $target | Out-Null
          robocopy Sillytavern $target /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -gt 7) { throw 'Could not copy clean pinned SillyTavern source into installer acceptance target' }
          $global:LASTEXITCODE = 0
          $corePlugin = Join-Path $target 'plugins/logic-engine'
          $corePluginFiles = @(
            'index.mjs',
            'manifest.json',
            'package.json',
            'scripts/sillytavern-patch-manager.mjs',
            'host-adapter/sillytavern-final-send-adapter.mjs',
            'host-adapter/embedded-gateway-runtime.mjs',
            'host-adapter/extension-gateway/server-plugin/host-adapter.mjs',
            'host-adapter/npc-generation-request-metadata.mjs',
            'host-adapter/npc-generation-content-projection.mjs',
            'src/application/npc-generation-context-host-bridge.js'
          )
          foreach ($relative in $corePluginFiles) {
            $destination = Join-Path $corePlugin $relative
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $relative $destination
          }
          node scripts/install-sillytavern-host-patch-bundle.mjs --st-root $target
          if ($LASTEXITCODE -ne 0) { throw 'Transactional Host patch-bundle installer acceptance failed' }
      - name: Install pinned SillyTavern runtime dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: Sillytavern
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Gateway artifacts and apply pinned lifecycle patch
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $corePlugin = 'Sillytavern/plugins/logic-engine'
          $corePluginFiles = @(
            'index.mjs',
            'manifest.json',
            'package.json',
            'scripts/sillytavern-patch-manager.mjs',
            'host-adapter/sillytavern-final-send-adapter.mjs',
            'host-adapter/embedded-gateway-runtime.mjs',
            'host-adapter/extension-gateway/server-plugin/host-adapter.mjs',
            'host-adapter/npc-generation-request-metadata.mjs',
            'host-adapter/npc-generation-content-projection.mjs',
            'src/application/npc-generation-context-host-bridge.js'
          )
          foreach ($relative in $corePluginFiles) {
            $destination = Join-Path $corePlugin $relative
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $relative $destination
          }
          New-Item -ItemType Directory -Force Sillytavern/plugins/logic-engine-extension-gateway | Out-Null
          Copy-Item host-adapter/extension-gateway/server-plugin/*.mjs,host-adapter/extension-gateway/server-plugin/*.js,host-adapter/extension-gateway/server-plugin/package.json Sillytavern/plugins/logic-engine-extension-gateway/
          New-Item -ItemType Directory -Force Sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway | Out-Null
          Copy-Item host-adapter/extension-gateway/index.js,host-adapter/extension-gateway/gateway-policy.mjs,host-adapter/extension-gateway/host-context.mjs,host-adapter/extension-gateway/conversation-identity.mjs,host-adapter/extension-gateway/manifest.json Sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/
          # Re-checkout pinned blobs with LF before applying LF-authored patches.
          git -C Sillytavern config core.autocrlf false
          git -C Sillytavern config core.eol lf
          git -C Sillytavern reset --hard HEAD
          git -C Sillytavern checkout-index --force --all
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SillyTavern tracked files could not be rewritten with LF before patching' }
          $patch = (Resolve-Path host-adapter/prototype/patches/sillytavern-1.19.0-lifecycle-hooks.patch).Path
          git -C Sillytavern -c core.autocrlf=false apply --ignore-space-change --ignore-whitespace --unidiff-zero --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Host lifecycle patch does not apply cleanly' }
          git -C Sillytavern -c core.autocrlf=false apply --ignore-space-change --ignore-whitespace --unidiff-zero $patch
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Host lifecycle patch application failed' }
          $rootMutationPatch = (Resolve-Path host-adapter/prototype/patches/sillytavern-1.19.0-root-mutation-guards.patch).Path
          git -C Sillytavern -c core.autocrlf=false apply --ignore-space-change --ignore-whitespace --unidiff-zero --check $rootMutationPatch
          if ($LASTEXITCODE -ne 0) { throw 'Root mutation guard patch does not apply cleanly' }
          git -C Sillytavern -c core.autocrlf=false apply --ignore-space-change --ignore-whitespace --unidiff-zero $rootMutationPatch
          if ($LASTEXITCODE -ne 0) { throw 'Root mutation guard patch application failed' }
          git -C Sillytavern -c core.whitespace=cr-at-eol diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Host lifecycle patch contains whitespace errors' }
          $expected = @(
            'public/script.js',
            'public/scripts/bookmarks.js',
            'public/scripts/chat-backups.js',
            'public/scripts/group-chats.js',
            'public/scripts/logic-engine-lifecycle/conversation-identity.mjs',
            'public/scripts/logic-engine-lifecycle/lifecycle-journal.mjs',
            'public/scripts/logic-engine-lifecycle/st-lifecycle-bridge.mjs',
            'public/scripts/slash-commands.js',
            'src/endpoints/assets.js',
            'src/endpoints/avatars.js',
            'src/endpoints/backends/chat-completions.js',
            'src/endpoints/backgrounds.js',
            'src/endpoints/backups.js',
            'src/endpoints/characters.js',
            'src/endpoints/chats.js',
            'src/endpoints/content-manager.js',
            'src/endpoints/data-maid.js',
            'src/endpoints/extensions.js',
            'src/endpoints/files.js',
            'src/endpoints/groups.js',
            'src/endpoints/image-metadata.js',
            'src/endpoints/images.js',
            'src/endpoints/logic-engine-host-inventory-handler.mjs',
            'src/endpoints/moving-ui.js',
            'src/endpoints/presets.js',
            'src/endpoints/quick-replies.js',
            'src/endpoints/secrets.js',
            'src/endpoints/settings.js',
            'src/endpoints/sprites.js',
            'src/endpoints/stable-diffusion.js',
            'src/endpoints/stats.js',
            'src/endpoints/themes.js',
            'src/endpoints/users-admin.js',
            'src/endpoints/users-private.js',
            'src/endpoints/users-public.js',
            'src/endpoints/vectors.js',
            'src/endpoints/worldinfo.js',
            'src/server-main.js',
            'src/users.js'
          )
          $actual = @((git -C Sillytavern diff --name-only) + (git -C Sillytavern ls-files --others --exclude-standard) | Sort-Object)
          if (Compare-Object ($expected | Sort-Object) $actual) { throw 'Pinned Host patch changed files outside the reviewed allowlist' }
          if (Test-Path Sillytavern/src/endpoints/logic-engine-lifecycle.js) { throw 'Unexpected independent lifecycle route' }
          if (Test-Path Sillytavern/src/endpoints/logic-engine-host-inventory.js) { throw 'Unexpected independent inventory route' }
      - name: Verify pinned server plugin load order
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $server = Get-Content Sillytavern/src/server-main.js -Raw
          $loader = Get-Content Sillytavern/src/plugin-loader.js -Raw
          if ($server.IndexOf('app.use(requireLoginMiddleware)') -ge $server.IndexOf('loadPlugins(app, pluginsDirectory)')) { throw 'Plugin loader is not behind ST authentication middleware' }
          if (-not ($loader.Contains('/api/plugins/') -and $loader.Contains('router'))) { throw 'Native plugin route mount changed' }
          if ($server.Contains('/api/logic-engine')) { throw 'Unexpected direct Host API route' }
      - name: Syntax-check patched Host and Gateway modules
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          function Assert-NodeSyntax([string]$file) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "Node syntax check failed: $file" }
          }
          Get-ChildItem Sillytavern/plugins/logic-engine-extension-gateway/*.mjs | ForEach-Object { Assert-NodeSyntax $_.FullName }
          Assert-NodeSyntax 'Sillytavern/plugins/logic-engine-extension-gateway/fs-inventory.js'
          Assert-NodeSyntax 'Sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/index.js'
          Assert-NodeSyntax 'Sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/host-context.mjs'
          Assert-NodeSyntax 'Sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/gateway-policy.mjs'
          Assert-NodeSyntax 'Sillytavern/public/scripts/extensions/third-party/logic-engine-extension-gateway/conversation-identity.mjs'
          Assert-NodeSyntax 'host-adapter/prototype/generate-pinned-source-manifest.mjs'
          Assert-NodeSyntax 'Sillytavern/public/scripts/logic-engine-lifecycle/conversation-identity.mjs'
          Assert-NodeSyntax 'Sillytavern/public/scripts/logic-engine-lifecycle/lifecycle-journal.mjs'
          Assert-NodeSyntax 'Sillytavern/public/scripts/logic-engine-lifecycle/st-lifecycle-bridge.mjs'
          $files = @('public/script.js', 'public/scripts/bookmarks.js', 'public/scripts/group-chats.js', 'public/scripts/chat-backups.js', 'public/scripts/slash-commands.js', 'src/server-main.js', 'src/endpoints/backends/chat-completions.js', 'src/endpoints/chats.js', 'src/endpoints/groups.js', 'src/endpoints/characters.js', 'src/endpoints/backups.js', 'src/endpoints/data-maid.js', 'src/endpoints/settings.js', 'src/endpoints/users-private.js', 'src/endpoints/users-public.js', 'src/endpoints/users-admin.js', 'src/users.js', 'src/endpoints/logic-engine-host-inventory-handler.mjs', 'src/endpoints/content-manager.js', 'src/endpoints/image-metadata.js', 'src/endpoints/images.js', 'src/endpoints/moving-ui.js', 'src/endpoints/presets.js', 'src/endpoints/quick-replies.js', 'src/endpoints/secrets.js', 'src/endpoints/sprites.js', 'src/endpoints/stats.js', 'src/endpoints/themes.js', 'src/endpoints/worldinfo.js', 'src/endpoints/vectors.js', 'src/endpoints/extensions.js', 'src/endpoints/backgrounds.js', 'src/endpoints/avatars.js', 'src/endpoints/assets.js', 'src/endpoints/files.js', 'src/endpoints/stable-diffusion.js', 'src/endpoints/thumbnails.js', 'src/plugin-loader.js')
          foreach ($file in $files) { Assert-NodeSyntax (Join-Path Sillytavern $file) }
      - name: Run Host lifecycle and identity acceptance tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SILLYTAVERN_DIR: Sillytavern
          SILLYTAVERN_SOURCE_ROOT: Sillytavern
          LOGIC_ENGINE_RUN_ST_LIFECYCLE_HARNESS: '1'
        run: |
          node --test host-adapter/extension-gateway/tests/*.test.mjs host-adapter/prototype/tests/lifecycle-acceptance-scenarios.test.mjs host-adapter/prototype/tests/pinned-st-source-audit.test.mjs host-adapter/prototype/tests/st-host-inventory-handler.test.mjs host-adapter/prototype/tests/st-server-digest-proxy.test.mjs host-adapter/prototype/tests/windows-vss-snapshot.test.mjs src/application/host-session-context.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test experiments/host-adapter-runtime-harness/lifecycle-file-operations.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test experiments/host-adapter-source-audit/harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate pinned patched-source manifest
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SILLYTAVERN_DIR: Sillytavern
        run: |
          node host-adapter/prototype/generate-pinned-source-manifest.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified pinned-source manifest
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-pinned-source-manifest
          path: Sillytavern/plugins/logic-engine-extension-gateway/pinned-source-manifest.json
          if-no-files-found: error
          retention-days: 14
