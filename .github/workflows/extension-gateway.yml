name: Extension Gateway contract

on:
  pull_request:
    paths:
      - "src/deployment/extension-gateway.js"
      - "public/scripts/extensions/third-party/logic-engine-extension-gateway/**"
      - "tests/extension-gateway.test.js"
      - "tests/extension-gateway-st-integration.test.js"
      - "host-adapter/extension-gateway/patches/**"
      - "docs/108-extension-gateway-contract.md"
      - ".github/workflows/extension-gateway.yml"
  push:
    branches: [main, "feature/extension-gateway"]
    paths:
      - "src/deployment/extension-gateway.js"
      - "public/scripts/extensions/third-party/logic-engine-extension-gateway/**"
      - "tests/extension-gateway.test.js"
      - ".github/workflows/extension-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-gateway-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Syntax-check packaged Extension modules
        run: |
          node --check public/scripts/extensions/third-party/logic-engine-extension-gateway/index.js
          node --check public/scripts/extensions/third-party/logic-engine-extension-gateway/server-gateway.mjs
      - name: Run Extension Gateway security and lifecycle tests
        run: node --test tests/extension-gateway.test.js
      - name: Fetch official SillyTavern 1.19.0 into a disposable directory
        run: git clone --depth 1 --branch 1.19.0 https://github.com/SillyTavern/SillyTavern.git "$RUNNER_TEMP/SillyTavern"
      - name: Install, inspect, and roll back Gateway on official SillyTavern 1.19.0
        env:
          SILLYTAVERN_PATH: ${{ runner.temp }}/SillyTavern
        run: node --test tests/extension-gateway-st-integration.test.js
      - name: Fetch the uploaded SillyTavern 1.19.0 build commit
        run: |
          git clone --depth 1 https://github.com/SillyTavern/SillyTavern.git "$RUNNER_TEMP/SillyTavern-uploaded"
          git -C "$RUNNER_TEMP/SillyTavern-uploaded" fetch --depth 1 origin 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          git -C "$RUNNER_TEMP/SillyTavern-uploaded" checkout --detach FETCH_HEAD
      - name: Install, inspect, and roll back Gateway on uploaded SillyTavern build
        env:
          SILLYTAVERN_PATH: ${{ runner.temp }}/SillyTavern-uploaded
          SILLYTAVERN_EXPECTED_COMMIT: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          SILLYTAVERN_MANIFEST_PATH: host-adapter/extension-gateway/patches/patch-manager-manifest-uploaded-build.json
        run: node --test tests/extension-gateway-st-integration.test.js
