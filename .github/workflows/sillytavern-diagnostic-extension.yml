name: SillyTavern diagnostic extension checks

on:
  pull_request:
    paths:
      - "host-adapter/prototype/diagnostic-extension/**"
      - "host-adapter/prototype/diagnostic-health-proxy.mjs"
      - "host-adapter/prototype/tests/diagnostic-health-proxy.test.mjs"
      - "host-adapter/prototype/patches/sillytavern-1.19.0-diagnostic-status.patch"
      - ".github/workflows/sillytavern-diagnostic-extension.yml"

permissions:
  contents: read

jobs:
  pinned-st-diagnostic-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Logic-Engine branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout exact approved SillyTavern revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: sillytavern-host-checkout
      - name: Install health proxy helper
        run: cp host-adapter/prototype/diagnostic-health-proxy.mjs sillytavern-host-checkout/src/endpoints/logic-engine-diagnostic-health.mjs
      - name: Apply-check and apply diagnostic route patch
        run: |
          cd sillytavern-host-checkout
          git apply --check "$GITHUB_WORKSPACE/host-adapter/prototype/patches/sillytavern-1.19.0-diagnostic-status.patch"
          git apply "$GITHUB_WORKSPACE/host-adapter/prototype/patches/sillytavern-1.19.0-diagnostic-status.patch"
      - name: Syntax-check the patched host and extension
        run: |
          node --check sillytavern-host-checkout/src/server-startup.js
          node --check sillytavern-host-checkout/src/endpoints/logic-engine-diagnostic.js
          node --check sillytavern-host-checkout/src/endpoints/logic-engine-diagnostic-health.mjs
          node --check host-adapter/prototype/diagnostic-extension/index.js
      - name: Test fail-closed health probe
        run: node --test host-adapter/prototype/tests/diagnostic-health-proxy.test.mjs
