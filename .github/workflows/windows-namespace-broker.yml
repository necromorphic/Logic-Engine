name: Windows Namespace Broker Native Build

on:
  pull_request:
    paths:
      - "native/windows-namespace-broker/**"
      - "native/secure-vfs-probe/windows_relative_open.h"
      - "tests/windows-broker-service-host.test.js"
      - ".github/workflows/windows-namespace-broker.yml"
  push:
    branches:
      - main
      - integration/host-core-v1
    paths:
      - "native/windows-namespace-broker/**"
      - "native/secure-vfs-probe/windows_relative_open.h"
      - "tests/windows-broker-service-host.test.js"
      - ".github/workflows/windows-namespace-broker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Initialize MSVC x64 toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "Env:$($matches[1])" -Value $matches[2] }
          }

      - name: Compile SCM broker with manifest store and namespace adapter
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath > "%RUNNER_TEMP%\vs-path.txt"
          set /p VS_PATH=<"%RUNNER_TEMP%\vs-path.txt"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W4 /WX /guard:cf /DUNICODE /D_UNICODE native\windows-namespace-broker\windows_broker_service.c native\windows-namespace-broker\windows_manifest_store.c native\windows-namespace-broker\windows_namespace_adapter.c /link advapi32.lib bcrypt.lib /OUT:"%RUNNER_TEMP%\logic-engine-sqlite-broker.exe"
          if errorlevel 1 exit /b 1

      - name: Compile and run native metadata and sidecar smoke test
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath > "%RUNNER_TEMP%\vs-path.txt"
          set /p VS_PATH=<"%RUNNER_TEMP%\vs-path.txt"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W4 /WX /guard:cf /DUNICODE /D_UNICODE native\windows-namespace-broker\windows_manifest_store_smoke.c /link advapi32.lib bcrypt.lib /OUT:"%RUNNER_TEMP%\windows-broker-smoke.exe"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\windows-broker-smoke.exe"
          if errorlevel 1 exit /b 1

      - name: Run Windows broker source contract tests
        shell: pwsh
        run: node --test tests/windows-broker-service-host.test.js tests/better-sqlite3-vfs-windows-handle-relative.test.js
