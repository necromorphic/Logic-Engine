name: SillyTavern Patch Manager

on:
  pull_request:
    paths:
      - "src/deployment/sillytavern-patch-manager.js"
      - "scripts/Manage-SillyTavernIntegration.js"
      - "tests/sillytavern-patch-manager.test.js"
      - ".github/workflows/sillytavern-patch-manager.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Run Patch Manager transaction and recovery tests
        run: node --test tests/sillytavern-patch-manager.test.js
