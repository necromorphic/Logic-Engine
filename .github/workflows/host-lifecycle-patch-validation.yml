name: Host Extension Gateway static validation
on:
  pull_request:
  push:
    branches:
      - "host/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check Gateway source and server-plugin packaging
        run: |
          node --check host-adapter/extension-gateway/index.js
          node --check host-adapter/extension-gateway/host-context.mjs
          node --check host-adapter/extension-gateway/gateway-policy.mjs
          node --check host-adapter/extension-gateway/server-plugin/index.mjs
          node --check host-adapter/extension-gateway/server-plugin/host-adapter.mjs
          node --check host-adapter/extension-gateway/server-plugin/st-host-inventory-handler.mjs
          node --check host-adapter/extension-gateway/server-plugin/st-server-digest-proxy.mjs
          node --check host-adapter/extension-gateway/server-plugin/fs-inventory.js
          node --check src/application/host-session-context.js
          node --check src/application/host-session-context.test.js
          grep -F "id: 'logic-engine-extension-gateway'" host-adapter/extension-gateway/server-plugin/index.mjs
          ! grep -R -n --include='*.mjs' --include='*.js' '/api/logic-engine' host-adapter/extension-gateway
          ! grep -n '/api/logic-engine' host-adapter/prototype/patches/sillytavern-1.19.0-lifecycle-hooks.patch
          ! grep -n '/api/logic-engine' host-adapter/prototype/patches/sillytavern-1.19.0-lifecycle-hooks.patch
          grep -F "installation_id:account_id:conversation_uuid" host-adapter/extension-gateway/README.md
          grep -F "router.post('/host-lifecycle/events', hostAdapter.lifecycleEvents)" host-adapter/extension-gateway/server-plugin/index.mjs
          grep -F "router.get('/host-lifecycle/status', hostAdapter.lifecycleStatus)" host-adapter/extension-gateway/server-plugin/index.mjs
