name: Host Extension Gateway package validation

on:
  pull_request:
    paths:
      - "host-adapter/prototype/server-plugin/**"
      - "host-adapter/prototype/tests/server-plugin.test.mjs"
      - ".github/workflows/host-lifecycle-patch-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-extension-gateway-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Validate standalone plugin package
        run: |
          node --check host-adapter/prototype/server-plugin/index.mjs
          node --check host-adapter/prototype/server-plugin/st-host-inventory-handler.mjs
          node --check host-adapter/prototype/server-plugin/st-host-identity-store.mjs
          node --check host-adapter/prototype/server-plugin/host-data-inventory.mjs
          node --check host-adapter/prototype/server-plugin/st-source-inventory.mjs
          node --check host-adapter/prototype/server-plugin/fs-inventory.js
          node --check host-adapter/prototype/server-plugin/windows-vss-snapshot.mjs
          node --test host-adapter/prototype/tests/server-plugin.test.mjs host-adapter/prototype/tests/st-default-user-session.test.mjs host-adapter/prototype/tests/st-host-request-authentication-gate.test.mjs host-adapter/sillytavern-extension/tests/*.test.mjs
