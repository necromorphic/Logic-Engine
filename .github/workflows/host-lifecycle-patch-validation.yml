name: Host Extension Gateway validation

on:
  pull_request:
    paths:
      - "host-adapter/**"
      - "experiments/host-adapter-source-audit/**"
      - ".github/workflows/host-lifecycle-patch-validation.yml"
  push:
    branches:
      - "host/**"
    paths:
      - "host-adapter/**"
      - "experiments/host-adapter-source-audit/**"
      - ".github/workflows/host-lifecycle-patch-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-extension-gateway-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-extension-gateway:
    name: Native ST server-plugin and Extension Gateway validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Checkout exact SillyTavern source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: sillytavern-host-checkout
      - name: Assemble native server plugin without modifying SillyTavern
        run: |
          mkdir -p sillytavern-host-checkout/plugins
          cp -R host-adapter sillytavern-host-checkout/plugins/logic-engine-host-adapter
          test -f sillytavern-host-checkout/plugins/logic-engine-host-adapter/package.json
          test -f sillytavern-host-checkout/plugins/logic-engine-host-adapter/server-plugin/index.mjs
      - name: Verify authenticated native plugin mount
        run: |
          grep -F "app.use(requireLoginMiddleware);" sillytavern-host-checkout/src/server-main.js
          grep -F "loadPlugins(app, pluginsDirectory)" sillytavern-host-checkout/src/server-main.js
          grep -F 'app.use(`/api/plugins/${id}`, router)' sillytavern-host-checkout/src/plugin-loader.js
      - name: Syntax-check and test Extension Gateway
        run: |
          node --check host-adapter/server-plugin/index.mjs
          node --check host-adapter/server-plugin/context-route.mjs
          node --check host-adapter/extension-gateway/index.js
          node --check host-adapter/extension-gateway/host-client.mjs
          node --test host-adapter/server-plugin/tests/*.test.mjs
          node --test host-adapter/extension-gateway/tests/*.test.mjs
      - name: Run pinned SillyTavern source audit
        env:
          SILLYTAVERN_DIR: sillytavern-host-checkout
        run: node --test experiments/host-adapter-source-audit/harness.mjs
      - name: Run Host identity and lifecycle unit tests
        run: node --test host-adapter/prototype/tests/*.test.mjs tests/host-source-inventory.test.js
      - name: Confirm SillyTavern source tree remains pristine
        run: |
          cd sillytavern-host-checkout
          git diff --exit-code
