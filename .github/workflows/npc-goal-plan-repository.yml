name: NPC goal-plan repository
on:
  pull_request:
    paths:
      - "src/npc/goal-plan-repository.js"
      - "tests/npc-goal-plan-repository.test.js"
      - ".github/workflows/npc-goal-plan-repository.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npc-goal-plan-repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run NPC goal-plan repository contract tests
        run: node --test tests/npc-goal-plan-repository.test.js
