name: Host version snapshot API smoke

on:
  pull_request:
    paths:
      - 'src/api/server.js'
      - 'src/application/host-version-digest-ledger.js'
      - 'tests/host-version-ledger-api.test.js'
      - '.github/workflows/host-version-snapshot-api-smoke.yml'
  push:
    branches:
      - 'work/host-version-snapshot-reconcile-api-*'
    paths:
      - 'src/api/server.js'
      - 'src/application/host-version-digest-ledger.js'
      - 'tests/host-version-ledger-api.test.js'
      - '.github/workflows/host-version-snapshot-api-smoke.yml'

permissions:
  contents: read

jobs:
  snapshot-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run Host snapshot API tests
        run: node --test tests/host-version-ledger-api.test.js
