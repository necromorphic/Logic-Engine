name: Memory Provider blocker 3
on:
  pull_request:
    paths:
      - '.github/workflows/provider-blocker3.yml'
      - 'src/application/sqlite-memory-provider.js'
      - 'src/storage/sqlite-store.js'
      - 'src/security/accepted-head-*.js'
      - 'src/security/enroll-accepted-head-domain.js'
      - 'src/security/recover-accepted-head-domain.js'
      - 'src/security/memory-dispatch-gateway*.js'
      - 'tests/accepted-head-authority.test.js'
      - 'tests/core-accepted-head-handshake.test.js'
      - 'tests/provider-accepted-head-handshake.test.js'
      - 'tests/memory-dispatch-gateway.test.js'
      - 'tests/memory-provider-raw-archive.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-blocker3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Capture test environment fingerprint
        run: |
          node --version
          npm --version
          node -p "'node:sqlite=' + (process.versions.sqlite || 'not-exposed-by-this-Node-build')"
          node -p "JSON.stringify({platform: process.platform, arch: process.arch, versions: process.versions}, null, 2)"
          uname -a
          cat /etc/os-release
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Accepted-head, Provider, and protected-dispatch acceptance tests
        run: node --test tests/accepted-head-authority.test.js tests/core-accepted-head-handshake.test.js tests/provider-accepted-head-handshake.test.js tests/memory-dispatch-gateway.test.js tests/memory-provider-raw-archive.test.js

  runtime-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Capture test environment fingerprint
        run: |
          node --version
          npm --version
          node -p "'node:sqlite=' + (process.versions.sqlite || 'not-exposed-by-this-Node-build')"
          node -p "JSON.stringify({platform: process.platform, arch: process.arch, versions: process.versions}, null, 2)"
          uname -a
          cat /etc/os-release
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run full repository Runtime suite
        run: npm test
      - name: Run recalculation oracle
        run: node --test experiments/recalculation-oracle/harness.test.mjs
