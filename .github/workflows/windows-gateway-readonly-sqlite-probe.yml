name: Windows gateway read-only SQLite WAL probe
on:
  push:
    branches:
      - integration/host-core-v1
    paths:
      - 'scripts/security/gateway_readonly_sqlite_probe.mjs'
      - 'scripts/security/windows_sqlite_identity_reader.ps1'
      - '.github/workflows/windows-gateway-readonly-sqlite-probe.yml'
      - 'docs/security/gateway-readonly-sqlite-probe.md'
  pull_request:
    paths:
      - 'scripts/security/gateway_readonly_sqlite_probe.mjs'
      - 'scripts/security/windows_sqlite_identity_reader.ps1'
      - '.github/workflows/windows-gateway-readonly-sqlite-probe.yml'
      - 'docs/security/gateway-readonly-sqlite-probe.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-disposable-acl-probe:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Probe read-only SQLite access under a separate Windows service identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = [guid]::NewGuid().ToString('N').Substring(0, 6)
          $root = Join-Path $env:RUNNER_TEMP "le-gw-probe-$suffix"
          $probeSource = Join-Path $env:GITHUB_WORKSPACE 'scripts/security/gateway_readonly_sqlite_probe.mjs'
          $readerSource = Join-Path $env:GITHUB_WORKSPACE 'scripts/security/windows_sqlite_identity_reader.ps1'
          $nodeSource = (Get-Command node.exe -ErrorAction Stop).Source
          $nodeSourceDirectory = Split-Path -Parent $nodeSource
          $nodeRuntime = Join-Path $root 'node-runtime'
          $node = Join-Path $nodeRuntime 'node.exe'
          $probeScript = Join-Path $root 'gateway_readonly_sqlite_probe.mjs'
          $readerScript = Join-Path $root 'windows_sqlite_identity_reader.ps1'
          $resultDirectory = Join-Path $root 'reader-results'
          $localServiceSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-19')
          $systemSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-18')
          $administratorsSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')
          $writerProcesses = @()
          $taskNames = @()
          try {
            New-Item -ItemType Directory -Path $root, $nodeRuntime, $resultDirectory | Out-Null
            foreach ($source in @($probeSource, $readerSource)) {
              if (-not (Test-Path -LiteralPath $source)) { throw "Required probe source is missing: $source" }
            }
            Copy-Item -Path (Join-Path $nodeSourceDirectory '*') -Destination $nodeRuntime -Recurse -Force
            Copy-Item -LiteralPath $probeSource -Destination $probeScript
            Copy-Item -LiteralPath $readerSource -Destination $readerScript
            if (-not (Test-Path -LiteralPath $node)) { throw 'Copied Node runtime is incomplete: node.exe is missing.' }
            & $node --version
            if ($LASTEXITCODE -ne 0) { throw 'Copied Node runtime failed its startup check.' }
            & $node -e "require('node:sqlite'); console.log('node:sqlite available')"
            if ($LASTEXITCODE -ne 0) { throw 'Copied Node runtime cannot load node:sqlite.' }

            # The reader runs as the built-in, non-administrator LOCAL SERVICE account.
            $rootAcl = Get-Acl -LiteralPath $root
            $rootRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $localServiceSid,
              [System.Security.AccessControl.FileSystemRights]::ReadAndExecute,
              ([System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [System.Security.AccessControl.InheritanceFlags]::ObjectInherit),
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow
            )
            $rootAcl.AddAccessRule($rootRule)
            Set-Acl -LiteralPath $root -AclObject $rootAcl

            $resultAcl = Get-Acl -LiteralPath $resultDirectory
            $resultRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $localServiceSid,
              [System.Security.AccessControl.FileSystemRights]::Modify,
              ([System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [System.Security.AccessControl.InheritanceFlags]::ObjectInherit),
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow
            )
            $resultAcl.AddAccessRule($resultRule)
            Set-Acl -LiteralPath $resultDirectory -AclObject $resultAcl

            foreach ($role in @('Core', 'Provider')) {
              $dir = Join-Path $root $role
              New-Item -ItemType Directory -Path $dir | Out-Null
              Set-Content -LiteralPath (Join-Path $dir 'sentinel-do-not-rename.txt') -Value 'fixture'
              $acl = Get-Acl -LiteralPath $dir
              $acl.SetAccessRuleProtection($true, $false)
              $acl.Access | ForEach-Object { [void]$acl.RemoveAccessRule($_) }
              $inherit = [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
              $prop = [System.Security.AccessControl.PropagationFlags]::None
              foreach ($entry in @(
                @{ sid = $systemSid; rights = [System.Security.AccessControl.FileSystemRights]::FullControl },
                @{ sid = $administratorsSid; rights = [System.Security.AccessControl.FileSystemRights]::FullControl },
                @{ sid = $localServiceSid; rights = [System.Security.AccessControl.FileSystemRights]::ReadAndExecute }
              )) {
                $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($entry.sid, $entry.rights, $inherit, $prop, [System.Security.AccessControl.AccessControlType]::Allow)
                [void]$acl.AddAccessRule($rule)
              }
              Set-Acl -LiteralPath $dir -AclObject $acl
            }

            $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            foreach ($role in @('Core', 'Provider')) {
              $dir = Join-Path $root $role
              $db = Join-Path $dir 'state.sqlite'
              $ready = Join-Path $env:RUNNER_TEMP "le-gw-probe-$role-$suffix.ready"
              $writerArgs = ('"{0}" writer "{1}" "{2}"' -f $probeScript, $db, $ready)
              $writer = Start-Process -FilePath $node -ArgumentList $writerArgs -PassThru -WindowStyle Hidden -WorkingDirectory $root
              $writerProcesses += $writer
              $deadline = (Get-Date).AddSeconds(15)
              while (-not (Test-Path -LiteralPath $ready) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
              if (-not (Test-Path -LiteralPath $ready)) {
                if ($writer.HasExited) { throw "SQLite writer exited early for $role with code $($writer.ExitCode)." }
                throw "SQLite writer did not create live WAL/SHM for $role."
              }
              foreach ($sidecar in @("$db-wal", "$db-shm")) {
                if (-not (Test-Path -LiteralPath $sidecar)) { throw "Missing live SQLite sidecar: $sidecar" }
              }

              $out = Join-Path $resultDirectory "$role.out"
              $result = Join-Path $resultDirectory "$role.exit"
              $taskName = "LogicEngine-GatewaySqliteProbe-$suffix-$role"
              $taskNames += $taskName
              $taskArguments = '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}" -NodePath "{1}" -ProbeScript "{2}" -DatabasePath "{3}" -OutputPath "{4}" -ResultPath "{5}"' -f $readerScript, $node, $probeScript, $db, $out, $result
              $action = New-ScheduledTaskAction -Execute $powershell -Argument $taskArguments
              $principal = New-ScheduledTaskPrincipal -UserId 'NT AUTHORITY\LOCAL SERVICE' -LogonType ServiceAccount -RunLevel Limited
              $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 1) -StartWhenAvailable
              Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings -Force | Out-Null
              Start-ScheduledTask -TaskName $taskName

              $deadline = (Get-Date).AddSeconds(45)
              while (-not (Test-Path -LiteralPath $result) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
              if (-not (Test-Path -LiteralPath $result)) {
                $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction SilentlyContinue
                throw "Scheduled LOCAL SERVICE reader did not report completion for $role. LastTaskResult=$($taskInfo.LastTaskResult)"
              }
              Get-Content -LiteralPath $out
              $exitCode = [int](Get-Content -LiteralPath $result -Raw)
              if ($exitCode -ne 0) { throw "LOCAL SERVICE SQLite reader failed for $role with exit code $exitCode." }
              Unregister-ScheduledTask -TaskName $taskName -Confirm:$false
              $taskNames = @($taskNames | Where-Object { $_ -ne $taskName })
            }
          } finally {
            foreach ($taskName in $taskNames) {
              try { Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue } catch {}
              try { Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue } catch {}
            }
            foreach ($proc in $writerProcesses) { try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {} }
            if (Test-Path -LiteralPath $root) {
              $acl = Get-Acl -LiteralPath $root
              $acl.SetAccessRuleProtection($false, $true)
              Set-Acl -LiteralPath $root -AclObject $acl
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
            foreach ($file in @(
              (Join-Path $env:RUNNER_TEMP "le-gw-probe-Core-$suffix.ready"),
              (Join-Path $env:RUNNER_TEMP "le-gw-probe-Provider-$suffix.ready")
            )) {
              if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force -ErrorAction SilentlyContinue }
            }
          }
