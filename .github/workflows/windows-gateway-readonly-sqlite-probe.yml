name: Windows gateway read-only SQLite WAL probe
on:
  pull_request:
    paths:
      - 'scripts/security/gateway_readonly_sqlite_probe.py'
      - '.github/workflows/windows-gateway-readonly-sqlite-probe.yml'
      - 'docs/security/gateway-readonly-sqlite-probe.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-disposable-acl-probe:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Probe read-only SQLite access under a separate Windows identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = [guid]::NewGuid().ToString('N').Substring(0, 6)
          $password = ([guid]::NewGuid().ToString('N') + 'Aa1!')
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $account = "leGwProbe$suffix"
          $root = Join-Path $env:RUNNER_TEMP "le-gw-probe-$suffix"
          # Install a private Python runtime without setup-python's PowerShell bootstrap;
          # this runner enforces a machine execution policy that blocks setup.ps1.
          $pythonDir = Join-Path $env:RUNNER_TEMP "le-gw-python-$suffix"
          $pythonInstaller = Join-Path $env:RUNNER_TEMP 'python-3.12.10-amd64.exe'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe' -OutFile $pythonInstaller
          $install = Start-Process -FilePath $pythonInstaller -ArgumentList @('/quiet', 'InstallAllUsers=0', ("TargetDir={0}" -f $pythonDir), 'Include_launcher=0', 'Include_test=0', 'Include_pip=0', 'PrependPath=0') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Python installer failed with exit code $($install.ExitCode)." }
          $python = Join-Path $pythonDir 'python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw 'Private Python installation did not produce python.exe.' }
          $probeSource = Join-Path $env:GITHUB_WORKSPACE 'scripts/security/gateway_readonly_sqlite_probe.py'
          $probeScript = Join-Path $root 'gateway_readonly_sqlite_probe.py'
          $writerProcesses = @()
          $pythonAclPaths = @()
          $userSid = $null
          try {
            New-LocalUser -Name $account -Password $securePassword -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
            $userSid = (Get-LocalUser -Name $account).SID
            Write-Host "Pinned Python executable: $python"
            & $python --version
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Python runtime failed its startup check.' }

            # The alternate logon must be able to traverse the tool-cache path and load Python DLLs.
            $toolCache = $env:RUNNER_TOOL_CACHE
            if (-not $toolCache) { throw 'RUNNER_TOOL_CACHE is not defined.' }
            $cursor = $pythonDir
            while ($cursor -and ($cursor.Length -ge $toolCache.Length) -and $cursor.StartsWith($toolCache, [System.StringComparison]::OrdinalIgnoreCase)) {
              $pythonAclPaths += $cursor
              $parent = Split-Path -Parent $cursor
              if (-not $parent -or $parent -eq $cursor) { break }
              $cursor = $parent
            }
            if ($pythonAclPaths -notcontains $toolCache) { $pythonAclPaths += $toolCache }
            foreach ($aclPath in $pythonAclPaths) {
              & icacls.exe $aclPath /grant ("*{0}:(RX)" -f $userSid.Value) | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "Could not grant Python path traversal on $aclPath." }
            }
            & icacls.exe $pythonDir /grant ("*{0}:(OI)(CI)RX" -f $userSid.Value) /T /C | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant read/execute access to the pinned Python runtime.' }

            $systemSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-18')
            $administratorsSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')
            New-Item -ItemType Directory -Path $root | Out-Null
            Copy-Item -LiteralPath $probeSource -Destination $probeScript

            # Grant traversal/read on the fixture root; Core and Provider get protected ACLs below.
            $rootAcl = Get-Acl -LiteralPath $root
            $rootRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $userSid,
              [System.Security.AccessControl.FileSystemRights]::ReadAndExecute,
              ([System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [System.Security.AccessControl.InheritanceFlags]::ObjectInherit),
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow
            )
            $rootAcl.SetAccessRule($rootRule)
            Set-Acl -LiteralPath $root -AclObject $rootAcl

            foreach ($role in @('Core', 'Provider')) {
              $dir = Join-Path $root $role
              New-Item -ItemType Directory -Path $dir | Out-Null
              Set-Content -LiteralPath (Join-Path $dir 'sentinel-do-not-rename.txt') -Value 'fixture'
              $acl = Get-Acl -LiteralPath $dir
              $acl.SetAccessRuleProtection($true, $false)
              $acl.Access | ForEach-Object { [void]$acl.RemoveAccessRule($_) }
              $inherit = [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
              $prop = [System.Security.AccessControl.PropagationFlags]::None
              foreach ($entry in @(
                @{ sid = $systemSid; rights = [System.Security.AccessControl.FileSystemRights]::FullControl },
                @{ sid = $administratorsSid; rights = [System.Security.AccessControl.FileSystemRights]::FullControl },
                @{ sid = $userSid; rights = [System.Security.AccessControl.FileSystemRights]::ReadAndExecute }
              )) {
                $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($entry.sid, $entry.rights, $inherit, $prop, [System.Security.AccessControl.AccessControlType]::Allow)
                [void]$acl.AddAccessRule($rule)
              }
              Set-Acl -LiteralPath $dir -AclObject $acl
            }

            $credential = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\$account", $securePassword)
            $env:PATH = "$pythonDir;$env:PATH"
            foreach ($role in @('Core', 'Provider')) {
              $dir = Join-Path $root $role
              $db = Join-Path $dir 'state.sqlite'
              $ready = Join-Path $env:RUNNER_TEMP "le-gw-probe-$role-$suffix.ready"
              $out = Join-Path $env:RUNNER_TEMP "le-gw-probe-$role-$suffix.out"
              $err = Join-Path $env:RUNNER_TEMP "le-gw-probe-$role-$suffix.err"
              $writerArgs = @(
                ('"{0}"' -f $probeScript),
                'writer', ('"{0}"' -f $db), ('"{0}"' -f $ready)
              ) -join ' '
              $writer = Start-Process -FilePath $python -ArgumentList $writerArgs -PassThru -WindowStyle Hidden -WorkingDirectory $root
              $writerProcesses += $writer
              $deadline = (Get-Date).AddSeconds(15)
              while (-not (Test-Path -LiteralPath $ready) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
              if (-not (Test-Path -LiteralPath $ready)) {
                if ($writer.HasExited) { throw "SQLite writer exited early for $role with code $($writer.ExitCode)." }
                throw "SQLite writer did not create live WAL/SHM for $role."
              }
              foreach ($sidecar in @("$db-wal", "$db-shm")) {
                if (-not (Test-Path -LiteralPath $sidecar)) { throw "Missing live SQLite sidecar: $sidecar" }
              }

              $readerArgs = @(
                ('"{0}"' -f $probeScript),
                'reader', ('"{0}"' -f $db), 'unused'
              ) -join ' '
              $reader = Start-Process -FilePath $python -ArgumentList $readerArgs -Credential $credential -LoadUserProfile -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -WorkingDirectory $root
              if ($reader.ExitCode -ne 0) {
                $details = ''
                if (Test-Path $out) { $details += Get-Content $out -Raw }
                if (Test-Path $err) { $details += Get-Content $err -Raw }
                throw "Gateway read-only probe failed for $role (exit $($reader.ExitCode)): $details"
              }
              Get-Content -LiteralPath $out
            }
          } finally {
            foreach ($proc in $writerProcesses) { try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {} }
            if ($userSid) {
              foreach ($aclPath in $pythonAclPaths) {
                try { & icacls.exe $aclPath /remove:g ("*{0}" -f $userSid.Value) | Out-Host } catch {}
              }
              try { & icacls.exe $pythonDir /remove:g ("*{0}" -f $userSid.Value) /T /C | Out-Host } catch {}
            }
            if (Test-Path -LiteralPath $root) {
              $acl = Get-Acl -LiteralPath $root
              $acl.SetAccessRuleProtection($false, $true)
              Set-Acl -LiteralPath $root -AclObject $acl
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
            try { Remove-LocalUser -Name $account -ErrorAction SilentlyContinue } catch {}
            if (Test-Path -LiteralPath $pythonDir) { Remove-Item -LiteralPath $pythonDir -Recurse -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $pythonInstaller) { Remove-Item -LiteralPath $pythonInstaller -Force -ErrorAction SilentlyContinue }
          }
