name: Runtime tests
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Runtime tests need no repository write, package publish, or deployment access.
permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npc-boundary:
    # Keep NPC-owned regression evidence independent of the self-hosted Windows
    # runner used by the complete repository runtime suite.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - run: node --test tests/npc-memory-candidate-eligibility.test.js

  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Pin actions to reviewed immutable commit SHAs; comments retain release context.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify installed Node.js
        shell: cmd
        run: |
          node --version
          node -e "const v = process.versions.node.split('.').map(Number); if (v[0] < 22 || (v[0] === 22 && v[1] < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"
      - name: Run repository tests
        shell: cmd
        run: npm test
      - name: Run recalculation harness
        shell: cmd
        run: node --test experiments/recalculation-oracle/harness.test.mjs
