name: Runtime tests
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Runtime tests need no repository write, package publish, or deployment access.
permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npc-boundary:
    # Run the NPC-owned pure admission boundary on a hosted runner as well.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run NPC memory boundary tests
        run: node --test tests/npc-memory-candidate-eligibility.test.js tests/memory-npc-consumer.test.js tests/trusted-initial-knowledge-source.test.js

  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      # Pin actions to reviewed immutable commit SHAs; comments retain release context.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify installed Node.js
        run: |
          node --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"
      - run: npm test
      - name: Run Host lifecycle prototype tests on Windows
        run: node --test host-adapter/prototype/tests/*.test.mjs
      - run: node --test experiments/recalculation-oracle/harness.test.mjs

  core-trusted-acquisition:
    # Keep Core-owned acquisition lifecycle tests runnable even when the local Windows runner is offline.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run trusted acquisition lifecycle and restore tests
        run: node --import ./tests/configure-test-env.js --test tests/core-trusted-initial-knowledge-ingestion.test.js tests/memory-provider-coordinated-restore.characterization.test.js

  windows-accepted-head-acl-smoke:
    # Exercise the candidate ACL script from an existing PR-triggered workflow.
    # The dedicated workflow in this PR becomes independently triggerable after merge.
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run accepted-head authority ACL disposable-fixture smoke
        shell: powershell
        run: .\\scripts\\security\\Test-AcceptedHeadAuthorityAcl.ps1
