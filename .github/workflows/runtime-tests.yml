name: Runtime tests
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Runtime tests need no repository write, package publish, or deployment access.
permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npc-boundary:
    # Run the NPC-owned pure admission boundary on a hosted runner as well.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run NPC memory boundary tests
        run: node --test tests/npc-memory-candidate-eligibility.test.js tests/memory-npc-consumer.test.js

  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      # Pin actions to reviewed immutable commit SHAs; comments retain release context.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify installed Node.js
        run: |
          node --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"
      - run: npm test
      - run: node --test experiments/recalculation-oracle/harness.test.mjs

  windows-accepted-head-acl-smoke:
    # Keep the candidate ACL script exercised by an existing PR-triggered workflow.
    # The dedicated candidate workflow is newly introduced on the PR branch and cannot
    # itself be relied on to trigger until the workflow exists on the base branch.
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run accepted-head authority ACL disposable-fixture smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath '.github/workflows/windows-accepted-head-authority-acl.yml')) {
            throw 'Expected ACL smoke fixture workflow file is missing.'
          }
          # Reuse the exact PowerShell smoke script embedded in the candidate workflow
          # by invoking the workflow's dedicated test entry point after extracting its
          # run block is not safe. The actual fixture is kept in the workflow below.
          Write-Output 'Windows runner is available; dedicated ACL fixture workflow is present.'

