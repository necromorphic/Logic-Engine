name: Runtime tests
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Runtime tests need no repository write, package publish, or deployment access.
permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npc-boundary:
    # Run the NPC-owned pure admission boundary on a hosted runner as well.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run NPC memory boundary tests
        run: node --test tests/npc-memory-candidate-eligibility.test.js tests/memory-npc-consumer.test.js

  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      # Pin actions to reviewed immutable commit SHAs; comments retain release context.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record exact Windows test environment
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          node --input-type=module -e "import os from 'node:os'; console.log(JSON.stringify({node:process.versions.node,sqlite:process.versions.sqlite,platform:process.platform,arch:process.arch,osType:os.type(),osRelease:os.release(),osVersion:os.version()},null,2))"
      - name: Verify installed Node.js
        run: |
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"
      - name: Run focused Memory Provider acceptance tests
        run: node --import ./tests/configure-test-env.js --test tests/sqlite-memory-provider.test.js tests/memory-provider-typed-failures.test.js tests/memory-provider-reconcile-interruption.test.js tests/memory-provider-raw-archive.test.js tests/memory-provider-query-revocation-race.test.js tests/memory-provider-cross-connection-revocation-race.test.js tests/memory-provider-coordinated-restore.characterization.test.js tests/memory-provider-file-backed-reconciliation.test.js tests/memory-dispatch-gateway.test.js tests/memory-provider-process-restart.test.js
      - name: Run full Runtime suite
        run: npm test
      - name: Run recalculation oracle
        run: node --test experiments/recalculation-oracle/harness.test.mjs
