name: Runtime tests
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Runtime tests need no repository write, package publish, or deployment access.
permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npc-boundary:
    # Run the NPC-owned pure admission boundary on a hosted runner as well.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run NPC memory boundary tests
        run: node --test tests/npc-memory-candidate-eligibility.test.js tests/memory-npc-consumer.test.js

  sillytavern-extension:
    # Validate the separate Host extension against the exact source revision it targets.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Test extension UI and safe failure behavior
        run: node --test host-adapter/sillytavern-extension/tests/*.test.mjs
      - name: Test existing Host lifecycle prototype
        run: node --test host-adapter/prototype/tests/*.test.mjs
      - name: Check out the exact pinned SillyTavern source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: SillyTavern
      - name: Verify extension hooks against the pinned SillyTavern loader
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import { readFileSync } from 'node:fs'; const loader = readFileSync('SillyTavern/public/scripts/extensions.js', 'utf8'); const manifest = JSON.parse(readFileSync('host-adapter/sillytavern-extension/manifest.json', 'utf8')); assert.match(loader, /renderExtensionTemplateAsync/); assert.match(loader, /'disable'.*'activate'/s); assert.equal(manifest.hooks.activate, 'init'); assert.equal(manifest.hooks.disable, 'cleanup'); assert.equal(manifest.js, 'index.js'); assert.equal(manifest.css, 'style.css'); console.log('Pinned SillyTavern extension loader contract verified');"
      - name: Verify pinned source revision and generate review patch
        run: |
          test "$(git -C SillyTavern rev-parse HEAD)" = "06bde939fb1e9c4c8d8641d810f0a916b5bce127"
          node host-adapter/sillytavern-extension/prepare-pinned-st-patch.mjs
      - name: Verify patch applies cleanly to the pinned SillyTavern revision
        run: git -C SillyTavern apply --check ../host-adapter/sillytavern-extension/patches/sillytavern-1.19.0-logic-engine-bridge.patch

  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      # Pin actions to reviewed immutable commit SHAs; comments retain release context.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify installed Node.js
        run: |
          node --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"
      - run: npm test
      - run: node --test experiments/recalculation-oracle/harness.test.mjs
