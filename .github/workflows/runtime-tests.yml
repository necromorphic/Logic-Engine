name: Runtime tests
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Runtime tests need no repository write, package publish, or deployment access.
permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npc-boundary:
    # Run the NPC-owned pure admission boundary on a hosted runner as well.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run NPC memory boundary tests
        run: node --test tests/npc-memory-candidate-eligibility.test.js tests/memory-npc-consumer.test.js tests/trusted-initial-knowledge-source.test.js

  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      # Pin actions to reviewed immutable commit SHAs; comments retain release context.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify installed Node.js
        run: |
          node --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"
      - run: npm test
      - name: Run Host lifecycle prototype tests on Windows
        run: node --test host-adapter/prototype/tests/*.test.mjs
      - run: node --test experiments/recalculation-oracle/harness.test.mjs

  windows-symlink-security:
    # The self-hosted Windows service account cannot create symlinks.
    # Run the application-level reparse-point cases on a hosted Windows token
    # that has the required privilege, and fail rather than skip if unavailable.
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Probe Windows Node path and descriptor identity fields
        run: node --test tests/windows-file-identity-probe.test.js
      - name: Run application-level Windows symlink rejection tests
        env:
          LOGIC_ENGINE_REQUIRE_SYMLINK_TESTS: '1'
        run: node --import ./tests/configure-test-env.js --test tests/core-trusted-initial-knowledge-ingestion.test.js tests/sqlite-memory-provider.test.js

  secure-vfs-registration-probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Build VFS probe on Linux
        if: runner.os == 'Linux'
        run: cc -O2 -fPIC -shared -I native/secure-vfs-probe native/secure-vfs-probe/secure_vfs_probe.c -o native/secure-vfs-probe/secure_vfs_probe.so
      - name: Build VFS probe on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $command = 'call "' + $vcvars + '" && cl /nologo /O2 /LD /I native\\secure-vfs-probe native\\secure-vfs-probe\\secure_vfs_probe.c /link /OUT:native\\secure-vfs-probe\\secure_vfs_probe.dll'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw 'VFS probe compilation failed' }
      - name: Verify persistent VFS registration through node:sqlite
        env:
          LOGIC_ENGINE_VFS_PROBE_PATH: ${{ runner.os == 'Windows' && 'native/secure-vfs-probe/secure_vfs_probe.dll' || 'native/secure-vfs-probe/secure_vfs_probe.so' }}
        run: node --test tests/security-vfs-extension-bootstrap.test.js

  core-trusted-acquisition:
    # Keep Core-owned acquisition lifecycle tests runnable even when the local Windows runner is offline.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run trusted acquisition lifecycle and restore tests
        run: node --import ./tests/configure-test-env.js --test tests/core-trusted-initial-knowledge-ingestion.test.js tests/memory-provider-coordinated-restore.characterization.test.js
