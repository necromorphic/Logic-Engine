name: Runtime tests
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Runtime tests need no repository write, package publish, or deployment access.
permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Pin actions to reviewed immutable commit SHAs; comments retain release context.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify installed Node.js
        shell: pwsh
        run: |
          node --version
          $version = [version](node -p "process.versions.node")
          if ($version -lt [version]"22.13.0") {
            throw "Node.js 22.13.0 or newer is required; found $version"
          }
      - run: npm test
      - run: node --test experiments/recalculation-oracle/harness.test.mjs
