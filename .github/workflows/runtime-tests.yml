name: Runtime tests
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Runtime tests need no repository write, package publish, or deployment access.
permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npc-boundary:
    # Run the NPC-owned pure admission boundary on a hosted runner as well.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run NPC memory boundary tests
        run: node --import ./tests/configure-test-env.js --test tests/npc-memory-candidate-eligibility.test.js tests/memory-npc-consumer.test.js tests/trusted-initial-knowledge-source.test.js tests/npc-epistemic-state.test.js tests/npc-knowledge-read.test.js tests/npc-belief-state.test.js tests/npc-knowledge-snapshot-race.test.js tests/npc-belief-state-snapshot-race.test.js

  test:
    # VSS-backed Host inventory tests require the hosted Windows image's VSS provider;
    # keep this portable CI job independent of the local self-hosted runner service.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      # Pin actions to reviewed immutable commit SHAs; comments retain release context.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify installed Node.js
        run: |
          node --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 13)) { console.error('Node.js 22.13.0 or newer is required; found ' + process.versions.node); process.exit(1); }"
      - run: npm test
      - name: Run Host lifecycle prototype tests on Windows
        run: node --test --test-concurrency=1 host-adapter/prototype/tests/*.test.mjs
      - run: node --test experiments/recalculation-oracle/harness.test.mjs

  core-trusted-acquisition:
    # Keep Core-owned acquisition lifecycle tests runnable even when the local Windows runner is offline.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run trusted acquisition lifecycle and restore tests
        run: node --import ./tests/configure-test-env.js --test tests/core-trusted-initial-knowledge-ingestion.test.js tests/trusted-initial-knowledge-api-boundary.test.js tests/memory-provider-coordinated-restore.characterization.test.js
  windows-symlink-security:
    # Windows lstat exposes a file ID but reports dev=0; verify the actual
    # descriptor identity and require the reparse-point tests on a hosted runner.
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify Node descriptor and path file identity
        run: node --test tests/windows-file-identity-probe.test.js
      - name: Run application-level Windows symlink rejection tests
        env:
          LOGIC_ENGINE_REQUIRE_SYMLINK_TESTS: '1'
        run: node --import ./tests/configure-test-env.js --test tests/core-trusted-initial-knowledge-ingestion.test.js tests/sqlite-memory-provider.test.js

  host-inventory-reconciliation:
    # Exercise the real file-backed Core/Coordinator/Host-ledger race on Linux
    # as well as the full Windows Runtime suite above.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run Host digest-ledger reconciliation and binding-revocation tests
        run: node --import ./tests/configure-test-env.js --test tests/host-version-digest-ledger.test.js tests/host-version-ledger-api.test.js

  process-contract:
    # Keep the pure Process Manager contract matrix runnable on a hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Run Process Manager contract tests
        run: node --test tests/process-contract.test.js

  mechanics-policy-authority:
    # Keep the versioned policy/evaluation lifecycle covered on a hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run mechanics policy-authority and canonical-lifecycle tests
        run: node --import ./tests/configure-test-env.js --test tests/authorized-read-service.test.js tests/mechanic-executor.test.js tests/mechanic-core-integration.test.js tests/api.test.js
      - name: Run independent recalculation oracle harness
        run: node --test experiments/recalculation-oracle/harness.test.mjs

  symlink-security:
    # Windows self-hosted runners may not have symlink creation privileges.
    # Keep both security-boundary tests mandatory on a Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run symlink security boundary tests
        run: >-
          node --import ./tests/configure-test-env.js --test
          --test-name-pattern="trusted importer rejects symlinks at the file-open boundary|file-backed Provider detects coordinator alias through a symlinked parent before opening either DB"
          tests/core-trusted-initial-knowledge-ingestion.test.js
          tests/sqlite-memory-provider.test.js
