name: Runtime tests
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Runtime tests need no repository write, package publish, or deployment access.
permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npc-boundary:
    # Run the NPC-owned pure admission boundary on a hosted runner as well.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run NPC memory boundary tests
        run: node --test tests/npc-memory-candidate-eligibility.test.js tests/memory-npc-consumer.test.js

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Hosted Linux is used only on this CI-only branch to validate exact Provider source/test blobs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: node --test experiments/recalculation-oracle/harness.test.mjs
