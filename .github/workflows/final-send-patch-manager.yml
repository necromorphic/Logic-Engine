name: SillyTavern Final-Send Patch Manager

on:
  pull_request:
    paths:
      - "index.mjs"
      - "host-adapter/patches/**"
      - "host-adapter/prototype/patches/**"
      - "host-adapter/extension-gateway/server-plugin/st-source-attestation.mjs"
      - "host-adapter/extension-gateway/server-plugin/st-server-digest-proxy.mjs"
      - "scripts/generate-sillytavern-patch-manager-manifest.mjs"
      - "scripts/verify-sillytavern-patch-manager-bundle.mjs"
      - "tests/fixtures/sillytavern-final-send-v1.manifest.json"
      - ".github/workflows/host-lifecycle-patch-bundle.yml"
      - "host-adapter/patch-manager/**"
      - "host-adapter/protected-memory-final-send.mjs"
      - "host-adapter/sillytavern-final-send-adapter.mjs"
      - "host-adapter/sillytavern-generation-bridge.mjs"
      - "tests/sillytavern-final-send-adapter.test.js"
      - "tests/protected-memory-final-send.test.js"
      - "tests/sillytavern-server-plugin-bootstrap.test.js"
      - "scripts/install-logic-engine-extension.mjs"
      - "scripts/sillytavern-patch-manager.mjs"
      - "manifest.json"
      - "tests/sillytavern-patch-manager.test.js"
      - "tests/sillytavern-final-send-patch-artifact.test.js"
      - "host-adapter/patch-manager/logic-engine-final-send-hook.test.mjs"
      - ".github/workflows/final-send-patch-manager.yml"
      - ".github/workflows/provider-blocker3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pinned-patch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Checkout exact SillyTavern 1.19.0 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          # Keep pinned upstream files byte-identical across Windows and Linux.
          # Patch Manager validates source hashes before it mutates any file.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: false
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: SillyTavern
      - name: Verify pinned source revision
        shell: powershell
        run: |
          $actual = (git -C SillyTavern rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '06bde939fb1e9c4c8d8641d810f0a916b5bce127') {
            throw "Pinned SillyTavern revision mismatch: $actual"
          }
      - name: Check server-plugin bootstrap syntax
        run: node --check index.mjs
      - name: Test unified Patch Manager and Final-Send contracts against exact Host source
        env:
          SILLYTAVERN_DIR: SillyTavern
        run: node --test tests/sillytavern-patch-manager.test.js tests/sillytavern-final-send-patch-artifact.test.js tests/sillytavern-final-send-adapter.test.js tests/protected-memory-final-send.test.js tests/sillytavern-generation-bridge.test.js tests/sillytavern-server-plugin-bootstrap.test.js host-adapter/patch-manager/manager.test.mjs host-adapter/patch-manager/logic-engine-final-send-hook.test.mjs
      - name: Generate and verify the committed full-bundle manifest
        env:
          SILLYTAVERN_DIR: SillyTavern
        shell: powershell
        run: |
          node scripts/generate-sillytavern-patch-manager-manifest.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $env:GITHUB_WORKSPACE) { throw 'GITHUB_WORKSPACE is not set.' }
          $repoRoot = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          git -C "$repoRoot" rev-parse --show-toplevel
          if ($LASTEXITCODE -ne 0) { throw "Git workspace is not a repository: $repoRoot" }
          git -C "$repoRoot" diff --exit-code -- host-adapter/patches/sillytavern-1.19.0-final-send.manifest.json
          $diffExitCode = $LASTEXITCODE
          if ($diffExitCode -eq 1) { throw 'Committed Patch Manager manifest is stale; regenerate and commit the manifest.' }
          if ($diffExitCode -ne 0) { throw "Git manifest comparison failed with exit code $diffExitCode." }
      - name: Create pristine pinned source worktree for bundle upgrade
        shell: powershell
        run: |
          git -C SillyTavern worktree add --detach "$PWD\SillyTavern-manager" 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify v1-to-v2 Patch Manager upgrade on Windows
        shell: powershell
        run: |
          node scripts/verify-sillytavern-patch-manager-bundle.mjs SillyTavern-manager tests/fixtures/sillytavern-final-send-v1.manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove pristine Patch Manager worktree
        if: always()
        shell: powershell
        run: |
          if (Test-Path 'SillyTavern-manager') {
            git -C SillyTavern worktree remove --force "$PWD\SillyTavern-manager"
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Patch Manager worktree cleanup failed.' }
          }
