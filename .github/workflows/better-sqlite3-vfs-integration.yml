name: better-sqlite3 default VFS integration
# Pair VFS validation with the final integration acceptance marker on every push.
# Install only runtime deps from the unpacked release; its dev deps include sqlite3 and require an unconfigured MSVC toolchain.

on:
  push:
    branches: ['security/**', 'integration/host-core-v1']
    paths:
      - 'native/secure-vfs-probe/*.c'
      - 'native/secure-vfs-probe/*.h'
      - 'tests/better-sqlite3-vfs-integration.test.js'
      - 'tests/better-sqlite3-vfs-broker-integration.test.js'
      - 'tests/run_better_sqlite3_cross_uid.py'
      - 'tests/better-sqlite3-vfs-cross-uid-recovery.test.js'
      - 'tests/better-sqlite3-vfs-windows-handle-relative.test.js'
      - 'tests/better-sqlite3-vfs-cross-uid.test.js'
      - 'tests/st-vectorservice-vfs-bootstrap-platform.test.js'
      - 'tests/st-vectorservice-vfs-database-path.test.js'
      - 'integrations/st-vectorservice/**'
      - 'native/posix-namespace-broker/**'
      - 'native/windows-namespace-broker/**'
      - 'tests/windows-broker-service-host.test.js'
      - '.github/workflows/windows-namespace-broker.yml'
      - '.github/workflows/better-sqlite3-vfs-integration.yml'
      - '.github/workflows/provider-blocker3.yml'
  pull_request:
    paths:
      - 'native/secure-vfs-probe/*.c'
      - 'native/secure-vfs-probe/*.h'
      - 'tests/better-sqlite3-vfs-integration.test.js'
      - 'tests/better-sqlite3-vfs-broker-integration.test.js'
      - 'tests/better-sqlite3-vfs-cross-uid.test.js'
      - 'tests/better-sqlite3-vfs-cross-uid-recovery.test.js'
      - 'tests/better-sqlite3-vfs-windows-handle-relative.test.js'
      - 'tests/st-vectorservice-vfs-bootstrap-platform.test.js'
      - 'tests/st-vectorservice-vfs-database-path.test.js'
      - 'integrations/st-vectorservice/**'
      - 'tests/run_better_sqlite3_cross_uid.py'
      - 'native/posix-namespace-broker/**'
      - 'native/windows-namespace-broker/**'
      - 'tests/windows-broker-service-host.test.js'
      - '.github/workflows/windows-namespace-broker.yml'
      - '.github/workflows/better-sqlite3-vfs-integration.yml'

      - '.github/workflows/provider-blocker3.yml'
permissions:
  contents: read
# Keep active exact-head VFS validation running across newer integration commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Download exact better-sqlite3 release
        run: |
          mkdir -p "$RUNNER_TEMP/better-sqlite3"
          npm pack better-sqlite3@13.0.3 --pack-destination "$RUNNER_TEMP/better-sqlite3"
          tar -xzf "$RUNNER_TEMP"/better-sqlite3/better-sqlite3-13.0.3.tgz -C "$RUNNER_TEMP/better-sqlite3"
      - name: Verify Node-API 10 runtime support
        run: |
          node -e 'const napi = Number(process.versions.napi); console.log("Node", process.version, "Node-API", napi); if (napi < 10) throw new Error("better-sqlite3 13.0.3 requires Node-API 10 (Node >=22.14.0)")'
      - name: Verify archived ST-VectorService Linux prebuild identity
        run: |
          actual="$(sha256sum "$RUNNER_TEMP/better-sqlite3/package/prebuilds/linux-x64.node" | cut -d' ' -f1)"
          test "$actual" = '6fd4292c6c5f352436cd85c9e1cb286978efa43c20ae350973f83414ced9991d'
      - name: Install better-sqlite3 build dependencies
        run: |
          cd "$RUNNER_TEMP/better-sqlite3/package"
          npm install --omit=dev --no-audit --no-fund
      - name: Verify exact Linux SQLite version, source ID and compile options
        run: |
          node -e 'const Database = require(process.env.BETTER_SQLITE3_PACKAGE_DIR); const fs = require("node:fs"); const os = require("node:os"); const path = require("node:path"); const dir = fs.mkdtempSync(path.join(os.tmpdir(), "st-vectorservice-sqlite-")); const db = new Database(path.join(dir, "vectors.sqlite")); try { const row = db.prepare("SELECT sqlite_version() AS version, sqlite_source_id() AS source_id").get(); const compileOptions = db.pragma("compile_options").map(x => x.compile_options); db.pragma("journal_mode = WAL"); const journalMode = db.pragma("journal_mode", { simple: true }); db.pragma("temp_store = MEMORY"); const tempStore = db.pragma("temp_store", { simple: true }); console.log("better-sqlite3 Linux runtime", JSON.stringify({ ...row, journalMode, tempStore, compileOptions }, null, 2)); if (row.version !== "3.53.4") throw new Error("Unexpected SQLite version"); if (row.source_id !== "2026-07-24 19:02:57 bf7c7f30031888f4e796e429ab3978879485813aaca6f641c7b33e4e09459bcc") throw new Error("Unexpected SQLite source ID"); if (journalMode !== "wal" || tempStore !== 2) throw new Error("Unexpected ST-VectorService SQLite PRAGMA behavior"); } finally { db.close(); fs.rmSync(dir, { recursive: true, force: true }); }'
        env:
          BETTER_SQLITE3_PACKAGE_DIR: ${{ runner.temp }}/better-sqlite3/package
      - name: Build secure VFS extension against the exact packaged SQLite headers
        run: |
          package="$RUNNER_TEMP/better-sqlite3/package"
          cc -O2 -fPIC -shared -DLOGIC_ENGINE_VFS_PROBE_ALLOW_UNBROKERED_TEST_ROLES -I "$package/deps/sqlite3" -I "$GITHUB_WORKSPACE/native/secure-vfs-probe" "$GITHUB_WORKSPACE/native/secure-vfs-probe/secure_vfs_probe.c" -o "$RUNNER_TEMP/logic_engine_secure_vfs_probe.so"
      - name: Exercise the exact published Linux prebuild through default VFS and broker protocol
        env:
          BETTER_SQLITE3_PACKAGE_DIR: ${{ runner.temp }}/better-sqlite3/package
          LOGIC_ENGINE_VFS_PROBE_PATH: ${{ runner.temp }}/logic_engine_secure_vfs_probe.so
        run: node --test tests/better-sqlite3-vfs-integration.test.js tests/better-sqlite3-vfs-windows-handle-relative.test.js tests/st-vectorservice-vfs-bootstrap-platform.test.js tests/st-vectorservice-vfs-database-path.test.js tests/better-sqlite3-vfs-broker-integration.test.js
      - name: Build strict Linux VFS without unbrokered enrollment API
        run: |
          package="$RUNNER_TEMP/better-sqlite3/package"
          cc -O2 -fPIC -shared -I "$package/deps/sqlite3" -I "$GITHUB_WORKSPACE/native/secure-vfs-probe" "$GITHUB_WORKSPACE/native/secure-vfs-probe/secure_vfs_probe.c" -o "$RUNNER_TEMP/logic_engine_secure_vfs_probe_strict.so"
      - name: Verify distinct-UID production broker boundary and broker restart recovery with the published prebuild
        env:
          BETTER_SQLITE3_PACKAGE_DIR: ${{ runner.temp }}/better-sqlite3/package
          LOGIC_ENGINE_VFS_PROBE_PATH: ${{ runner.temp }}/logic_engine_secure_vfs_probe_strict.so
        run: |
          python3 -m py_compile tests/run_better_sqlite3_cross_uid.py
          NODE_BINARY="$(command -v node)"
          sudo env NODE_BINARY="$NODE_BINARY" BETTER_SQLITE3_PACKAGE_DIR="$BETTER_SQLITE3_PACKAGE_DIR" LOGIC_ENGINE_VFS_PROBE_PATH="$LOGIC_ENGINE_VFS_PROBE_PATH" python3 tests/run_better_sqlite3_cross_uid.py

  windows-x64:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Compile Windows namespace broker and metadata store
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $exe = "$env:RUNNER_TEMP\logic-engine-sqlite-broker.exe"
          $command = 'call "' + $vcvars + '" && cl /nologo /W4 /WX /guard:cf /DUNICODE /D_UNICODE native\windows-namespace-broker\windows_broker_service.c native\windows-namespace-broker\windows_manifest_store.c native\windows-namespace-broker\windows_namespace_adapter.c native\windows-namespace-broker\windows_manifest_validator.c /link advapi32.lib bcrypt.lib /OUT:"' + $exe + '"'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Windows namespace broker compilation failed' }
      - name: Run Windows manifest-store and namespace native smoke test
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $exe = "$env:RUNNER_TEMP\windows-broker-smoke.exe"
          $command = 'call "' + $vcvars + '" && cl /nologo /W4 /WX /guard:cf /DUNICODE /D_UNICODE native\windows-namespace-broker\windows_manifest_store_smoke.c /link advapi32.lib bcrypt.lib /OUT:"' + $exe + '" && "' + $exe + '"'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Windows broker native smoke test failed' }
      - name: Run Windows broker source contract tests
        run: node --test tests/windows-broker-service-host.test.js
      - name: Download exact better-sqlite3 release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\better-sqlite3" | Out-Null
          npm pack better-sqlite3@13.0.3 --pack-destination "$env:RUNNER_TEMP\better-sqlite3"
          tar -xzf "$env:RUNNER_TEMP\better-sqlite3\better-sqlite3-13.0.3.tgz" -C "$env:RUNNER_TEMP\better-sqlite3"
      - name: Install better-sqlite3 runtime dependency
        shell: powershell
        run: |
          Set-Location "$env:RUNNER_TEMP\better-sqlite3\package"
          npm install --omit=dev --no-audit --no-fund
      - name: Verify Node-API 10 and archived Windows prebuild identity
        shell: powershell
        run: |
          node -e 'const napi = Number(process.versions.napi); console.log("Node", process.version, "Node-API", napi); if (napi < 10) throw new Error("better-sqlite3 13.0.3 requires Node-API 10")'
          $binary = "$env:RUNNER_TEMP\better-sqlite3\package\prebuilds\win32-x64.node"
          $actual = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'e21e5efd71fba66578e95b62554d9028064a80dafd7221bf8a8ef155de8d240a') {
            throw "better-sqlite3 Windows prebuild does not match the audited ST-VectorService archive: $actual"
          }
      - name: Verify exact Windows SQLite version, source ID and compile options
        shell: powershell
        env:
          BETTER_SQLITE3_PACKAGE_DIR: ${{ runner.temp }}\better-sqlite3\package
        run: |
          node -e 'const Database = require(process.env.BETTER_SQLITE3_PACKAGE_DIR); const fs = require("node:fs"); const os = require("node:os"); const path = require("node:path"); const dir = fs.mkdtempSync(path.join(os.tmpdir(), "st-vectorservice-sqlite-")); const db = new Database(path.join(dir, "vectors.sqlite")); try { const row = db.prepare("SELECT sqlite_version() AS version, sqlite_source_id() AS source_id").get(); const compileOptions = db.pragma("compile_options").map(x => x.compile_options); db.pragma("journal_mode = WAL"); const journalMode = db.pragma("journal_mode", { simple: true }); db.pragma("temp_store = MEMORY"); const tempStore = db.pragma("temp_store", { simple: true }); console.log("better-sqlite3 Windows runtime", JSON.stringify({ ...row, journalMode, tempStore, compileOptions }, null, 2)); if (row.version !== "3.53.4") throw new Error("Unexpected SQLite version"); if (row.source_id !== "2026-07-24 19:02:57 bf7c7f30031888f4e796e429ab3978879485813aaca6f641c7b33e4e09459bcc") throw new Error("Unexpected SQLite source ID"); if (journalMode !== "wal" || tempStore !== 2) throw new Error("Unexpected ST-VectorService SQLite PRAGMA behavior"); } finally { db.close(); fs.rmSync(dir, { recursive: true, force: true }); }'
      - name: Build secure VFS extension against better-sqlite3 bundled SQLite headers
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio Build Tools not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $package = "$env:RUNNER_TEMP\better-sqlite3\package"
          $extension = "$env:RUNNER_TEMP\logic_engine_secure_vfs_probe.dll"
          $command = '"' + $vcvars + '" && cl /nologo /O2 /LD /I "' + $package + '\deps\sqlite3" /I native\secure-vfs-probe native\secure-vfs-probe\secure_vfs_probe.c /link /OUT:"' + $extension + '"'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw 'better-sqlite3 VFS extension compilation failed' }
      - name: Exercise default VFS registration in the stock Windows better-sqlite3 engine
        shell: powershell
        env:
          BETTER_SQLITE3_PACKAGE_DIR: ${{ runner.temp }}\better-sqlite3\package
          LOGIC_ENGINE_VFS_PROBE_PATH: ${{ runner.temp }}\logic_engine_secure_vfs_probe.dll
        run: node --test tests/better-sqlite3-vfs-integration.test.js tests/better-sqlite3-vfs-windows-handle-relative.test.js tests/st-vectorservice-vfs-bootstrap-platform.test.js tests/st-vectorservice-vfs-database-path.test.js
